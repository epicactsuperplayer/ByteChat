<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ByteChat | Master Security</title>

    <script>
        window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};
        window.si=window.si||function(){(window.siq=window.siq||[]).push(arguments)};
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-deep: #050505;
            --bg-surface: #0f0f0f;
            --admin-neon: #00d4ff;
            --danger: #ff3b3b;
            --text-main: #f0f0f0;
            --sidebar-width: 260px;
            --nav-height: 75px;
        }

        /* --- STRICT MOBILE FIX --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; }

        #app-shell { display: flex; width: 100vw; height: 100vh; }

        /* Sidebar Logic: PC Only */
        #sidebar {
            width: var(--sidebar-width);
            background: var(--bg-surface);
            border-right: 1px solid #1a1a1a;
            display: flex; /* Default for PC */
            flex-direction: column;
            padding: 20px;
            flex-shrink: 0;
        }

        /* Viewport Logic: Fills remaining space */
        #viewport { flex-grow: 1; display: flex; flex-direction: column; position: relative; min-width: 0; }

        /* CRITICAL: Mobile Media Query - This kills the sidebar on phones */
        @media (max-width: 850px) {
            #sidebar { 
                display: none !important; /* Force hide sidebar */
                visibility: hidden;
                width: 0;
            }
            #viewport { width: 100vw; }
            .mobile-nav { display: flex !important; } /* Force show mobile bar */
            #messages-container { padding-bottom: 150px !important; } /* Extra space for keyboard */
        }

        /* --- ADMIN SECURITY CLASSES --- */
        /* These elements are HIDDEN by default and only shown via JS for you */
        .admin-exclusive { display: none !important; }
        .is-master-admin .admin-exclusive { display: flex !important; }
        .is-master-admin .admin-exclusive-inline { display: inline-block !important; }

        /* --- UI COMPONENTS --- */
        .profile-box {
            background: #151515;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #222;
        }

        #messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .msg-row { display: flex; gap: 10px; max-width: 85%; }
        .msg-row.me { align-self: flex-end; flex-direction: row-reverse; }

        .bubble {
            background: var(--bg-surface);
            padding: 12px 16px;
            border-radius: 18px;
            border: 1px solid #222;
            position: relative;
        }

        .admin-glow { border-color: var(--admin-neon); box-shadow: 0 0 10px rgba(0, 212, 255, 0.2); }

        .input-area {
            padding: 15px;
            background: var(--bg-surface);
            border-top: 1px solid #1a1a1a;
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            background: #181818;
            border: 1px solid #252525;
            color: #fff;
            padding: 12px 20px;
            border-radius: 25px;
        }

        /* --- MOBILE NAV --- */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            width: 100%;
            height: var(--nav-height);
            background: #000;
            border-top: 1px solid #222;
            justify-content: space-around;
            align-items: center;
            z-index: 999;
        }

        .nav-item { color: #555; text-align: center; font-size: 10px; cursor: pointer; }
        .nav-item.active { color: var(--admin-neon); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }

        .screen { display: none; height: 100%; flex-direction: column; }
        .active-screen { display: flex; }

        .del-btn { color: var(--danger); font-size: 12px; cursor: pointer; margin-top: 5px; opacity: 0.6; }
        .del-btn:hover { opacity: 1; }
    </style>
</head>
<body>

    <div id="app-shell">
        <aside id="sidebar">
            <h2 style="letter-spacing: 3px; text-align: center;">BYTECHAT</h2>
            <div class="profile-box">
                <img id="pc-pfp" src="" style="width:60px; height:60px; border-radius:50%; border:2px solid var(--admin-neon);">
                <div id="pc-name" style="font-weight:bold; margin-top:10px;">User</div>
            </div>
            <nav style="flex:1">
                <div onclick="nav('chat')" style="padding:15px; cursor:pointer;"><i class="fa fa-comment"></i> Chat</div>
                <div onclick="nav('profile')" style="padding:15px; cursor:pointer;"><i class="fa fa-user"></i> Profile</div>
                <div onclick="nav('admin')" class="admin-exclusive" style="padding:15px; cursor:pointer; color:var(--admin-neon);"><i class="fa fa-shield"></i> Admin Console</div>
            </nav>
            <button onclick="logout()" style="background:none; border:none; color:var(--danger); cursor:pointer;">Logout</button>
        </aside>

        <main id="viewport">
            <section id="s-chat" class="screen active-screen">
                <div id="messages-container"></div>
                <div class="input-area">
                    <input type="text" id="m-input" class="chat-input" placeholder="Enter message...">
                    <button onclick="send()" style="background:var(--admin-neon); border:none; padding:10px 20px; border-radius:20px; font-weight:bold;">SEND</button>
                </div>
            </section>

            <section id="s-profile" class="screen">
                <div style="padding:40px; max-width:500px; margin: 0 auto; width: 100%;">
                    <h3>Account Settings</h3>
                    <input type="text" id="set-name" class="chat-input" style="width:100%; margin-bottom:10px;" placeholder="Name">
                    <input type="text" id="set-pfp" class="chat-input" style="width:100%; margin-bottom:20px;" placeholder="PFP URL">
                    <button onclick="saveProfile()" style="width:100%; padding:15px; background:white; color:black; border:none; border-radius:10px; font-weight:bold;">UPDATE IDENTITY</button>
                </div>
            </section>

            <section id="s-admin" class="screen admin-exclusive">
                <div style="padding:40px; max-width:600px; margin: 0 auto; width: 100%;">
                    <h2 style="color:var(--admin-neon)">Root Access Terminal</h2>
                    <div style="background:#111; padding:20px; border-radius:15px; border: 1px solid var(--admin-neon);">
                        <p>Database Management</p>
                        <button onclick="clearDB()" style="background:var(--danger); color:white; border:none; padding:15px; width:100%; border-radius:10px; font-weight:bold;">PURGE ALL MESSAGES</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div class="mobile-nav">
        <div class="nav-item active" id="n-chat" onclick="nav('chat')"><i class="fa fa-comments"></i>Chat</div>
        <div class="nav-item" id="n-profile" onclick="nav('profile')"><i class="fa fa-user"></i>Profile</div>
        <div class="nav-item admin-exclusive" id="n-admin" onclick="nav('admin')"><i class="fa fa-shield-halved"></i>Admin</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCZlueIRciUi4hHxT00y0ez1jKT70ATWw",
            authDomain: "ekosecuruty.firebaseapp.com",
            projectId: "ekosecuruty",
            storageBucket: "ekosecuruty.firebasestorage.app",
            messagingSenderId: "655599032933",
            appId: "1:655599032933:web:c3c429704561672895c48c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const MASTER = "bytestorm.corp@gmail.com";
        let uData = {};

        // NAVIGATION
        window.nav = (t) => {
            // Check if user is admin before allowing nav to admin screen
            if(t === 'admin' && auth.currentUser.email.toLowerCase() !== MASTER) return;

            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById('s-' + t).classList.add('active-screen');
            
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            const mob = document.getElementById('n-' + t);
            if(mob) mob.classList.add('active');
        };

        // AUTH & SECURITY
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const isMaster = user.email.toLowerCase() === MASTER;
                if(isMaster) {
                    document.body.classList.add('is-master-admin');
                    console.log("Master Admin Session Verified.");
                }

                const docRef = doc(db, "users", user.uid);
                const snap = await getDoc(docRef);

                uData = snap.exists() ? snap.data() : { name: user.displayName, pfp: user.photoURL, email: user.email };
                if(!snap.exists()) await setDoc(docRef, uData);

                document.getElementById('pc-pfp').src = uData.pfp;
                document.getElementById('pc-name').innerText = uData.name;
                document.getElementById('set-name').value = uData.name;
                document.getElementById('set-pfp').value = uData.pfp;

                initChat();
            } else {
                await signInWithPopup(auth, new GoogleAuthProvider());
            }
        });

        // CHAT ENGINE
        window.send = async () => {
            const input = document.getElementById('m-input');
            const txt = input.value.trim();
            if(!txt) return;

            await addDoc(collection(db, "messages"), {
                text: txt,
                user: uData.name,
                pfp: uData.pfp,
                uid: auth.currentUser.uid,
                isAdmin: auth.currentUser.email.toLowerCase() === MASTER,
                timestamp: serverTimestamp()
            });
            input.value = "";
        };

        function initChat() {
            onSnapshot(query(collection(db, "messages"), orderBy("timestamp", "asc")), (snap) => {
                const cont = document.getElementById('messages-container');
                cont.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    const isMe = m.uid === auth.currentUser.uid;
                    const isMasterSession = auth.currentUser.email.toLowerCase() === MASTER;

                    cont.innerHTML += `
                        <div class="msg-row ${isMe ? 'me' : ''}">
                            <div class="bubble ${m.isAdmin ? 'admin-glow' : ''}">
                                <div style="font-size:10px; color:var(--admin-neon); font-weight:bold;">
                                    ${m.isAdmin ? '[ADMIN] ' : ''}${m.user}
                                </div>
                                <div style="margin-top:4px;">${m.text}</div>
                                ${isMasterSession ? `<div class="del-btn" onclick="delMsg('${d.id}')"><i class="fa fa-trash"></i> DELETE</div>` : ''}
                            </div>
                        </div>
                    `;
                });
                cont.scrollTop = cont.scrollHeight;
            });
        }

        // ADMIN SECURE FUNCTIONS
        window.delMsg = async (id) => {
            if(auth.currentUser.email.toLowerCase() !== MASTER) return alert("Unauthorized Attempt logged.");
            if(confirm("Erase message from cloud?")) await deleteDoc(doc(db, "messages", id));
        };

        window.clearDB = async () => {
            if(auth.currentUser.email.toLowerCase() !== MASTER) return;
            if(confirm("DANGER: WIPE EVERYTHING?")) {
                const q = await getDocs(collection(db, "messages"));
                q.forEach(async (d) => await deleteDoc(doc(db, "messages", d.id)));
            }
        };

        window.saveProfile = async () => {
            const n = document.getElementById('set-name').value;
            const p = document.getElementById('set-pfp').value;
            await setDoc(doc(db, "users", auth.currentUser.uid), { name: n, pfp: p }, { merge: true });
            location.reload();
        };

        window.logout = () => signOut(auth);

    </script>
</body>
</html>
