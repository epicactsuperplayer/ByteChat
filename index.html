<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ByteChat Hybrid</title>
    <style>
        :root { --bg: #000; --card: #111; --accent: #fff; --admin: #00d4ff; --danger: #ff3b3b; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: #fff; font-family: -apple-system, sans-serif; margin: 0; height: 100vh; display: flex; overflow: hidden; }

        /* --- RESPONSIVE SHELL --- */
        #app-container { display: flex; width: 100%; height: 100%; }
        
        /* SIDEBAR (Desktop Only) */
        #pc-sidebar { width: 300px; border-right: 1px solid #222; display: flex; flex-direction: column; padding: 20px; background: #050505; }
        
        /* MAIN CONTENT AREA */
        #main-stage { flex: 1; display: flex; flex-direction: column; position: relative; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }

        /* BUBBLES */
        .msg { display: flex; gap: 12px; max-width: 80%; }
        .pfp { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #333; flex-shrink: 0; }
        .bubble { background: var(--card); padding: 12px 16px; border-radius: 18px; position: relative; border: 1px solid #222; }
        .admin-glow { border-color: var(--admin); box-shadow: 0 0 15px rgba(0, 212, 255, 0.1); }
        .user-tag { font-size: 11px; font-weight: 800; color: var(--admin); display: block; margin-bottom: 4px; }

        /* INPUT */
        .input-box { padding: 20px; background: #000; border-top: 1px solid #222; display: flex; gap: 10px; }
        input { background: #151515; color: #fff; border: 1px solid #333; padding: 12px 20px; border-radius: 30px; flex: 1; outline: none; }
        .send-btn { background: #fff; color: #000; border: none; width: 50px; height: 50px; border-radius: 50%; font-weight: bold; cursor: pointer; }

        /* ADMIN DELETE - ONLY SHOWS FOR ADMIN */
        .admin-tools { display: none; margin-left: 10px; align-self: center; }
        body.is-admin .admin-tools { display: block; }
        .del-btn { color: var(--danger); font-size: 20px; cursor: pointer; background: none; border: none; }

        /* --- MOBILE ADAPTATION --- */
        @media (max-width: 768px) {
            #pc-sidebar { display: none; }
            #chat-window { padding-bottom: 80px; }
            .mobile-nav { display: flex !important; }
        }

        .mobile-nav { display: none; position: fixed; bottom: 0; width: 100%; height: 65px; background: #000; border-top: 1px solid #222; justify-content: space-around; align-items: center; }
        .nav-btn { color: #666; font-size: 10px; text-align: center; cursor: pointer; }
        .nav-btn.active { color: #fff; }

        /* LOGO */
        .logo { font-size: 24px; font-weight: 900; letter-spacing: 5px; text-align: center; margin-bottom: 30px; text-shadow: 0 0 10px var(--admin); }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="pc-sidebar">
            <div class="logo">BYTESTORM</div>
            <div style="text-align: center; margin-bottom: 20px;">
                <img id="sidebar-pfp" src="" style="width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--admin);">
            </div>
            <input type="text" id="pfp-input" placeholder="Update PFP URL">
            <input type="text" id="name-input" placeholder="Change Name">
            <button onclick="updateProfile()" style="background:#fff; color:#000; padding:10px; border-radius:10px; margin-top:10px; font-weight:bold;">SYNC PROFILE</button>
            
            <div id="admin-pc-menu" style="display:none; margin-top: 40px; border-top: 1px solid #222; padding-top: 20px;">
                <p style="color:var(--admin); font-size: 12px;">ADMIN CONSOLE</p>
                <button onclick="purgeMessages()" style="background:var(--danger); color:#fff; border:none; padding:10px; width:100%; border-radius:5px;">WIPE ALL CHAT</button>
            </div>
        </div>

        <div id="main-stage">
            <div id="chat-window"></div>
            
            <div class="input-box">
                <input type="text" id="msg-field" placeholder="Type a message...">
                <button class="send-btn" id="send-trigger">↑</button>
            </div>
        </div>
    </div>

    <div class="mobile-nav">
        <div class="nav-btn active">CHAT</div>
        <div class="nav-btn" onclick="alert('Use Sidebar on PC or Profile settings in next update!')">PROFILE</div>
        <div class="nav-btn" id="mobile-admin-tab" style="display:none;" onclick="purgeMessages()">PURGE</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCZlueIRciUi4hHxT00y0ez1jKT70ATWw",
            authDomain: "ekosecuruty.firebaseapp.com",
            projectId: "ekosecuruty",
            storageBucket: "ekosecuruty.firebasestorage.app",
            messagingSenderId: "655599032933",
            appId: "1:655599032933:web:c3c429704561672895c48c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN = "bytestorm.corp@gmail.com";
        let localUser = {};

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const isAdmin = user.email.toLowerCase() === ADMIN.toLowerCase();
                const snap = await getDoc(doc(db, "users", user.uid));
                localUser = snap.exists() ? snap.data() : { name: user.displayName, pfp: user.photoURL, role: isAdmin ? 'admin' : 'user' };
                
                if (isAdmin) {
                    document.body.classList.add('is-admin');
                    document.getElementById('admin-pc-menu').style.display = 'block';
                    document.getElementById('mobile-admin-tab').style.display = 'block';
                }

                document.getElementById('sidebar-pfp').src = localUser.pfp;
                document.getElementById('name-input').value = localUser.name;
                loadChat();
            } else {
                signInWithPopup(auth, new GoogleAuthProvider());
            }
        });

        // ACTION: Delete Single
        window.kill = async (id) => { if(confirm("Delete?")) await deleteDoc(doc(db, "messages", id)); };

        // ACTION: Purge All
        window.purgeMessages = async () => {
            if(confirm("DANGER: WIPE EVERYTHING?")) {
                const snap = await getDocs(collection(db, "messages"));
                snap.forEach(async (d) => await deleteDoc(doc(db, "messages", d.id)));
            }
        };

        document.getElementById('send-trigger').onclick = async () => {
            const txt = document.getElementById('msg-field').value;
            if(!txt) return;
            await addDoc(collection(db, "messages"), {
                text: txt,
                sender: localUser.name,
                pfp: localUser.pfp,
                admin: auth.currentUser.email === ADMIN,
                timestamp: serverTimestamp()
            });
            document.getElementById('msg-field').value = "";
        };

        function loadChat() {
            onSnapshot(query(collection(db, "messages"), orderBy("timestamp", "asc")), (snap) => {
                const window = document.getElementById('chat-window');
                window.innerHTML = "";
                snap.forEach(doc => {
                    const m = doc.data();
                    window.innerHTML += `
                        <div class="msg">
                            <img class="pfp" src="${m.pfp}">
                            <div class="bubble ${m.admin ? 'admin-glow' : ''}">
                                <span class="user-tag">${m.sender} ${m.admin ? '★' : ''}</span>
                                ${m.text}
                            </div>
                            <div class="admin-tools"><button class="del-btn" onclick="kill('${doc.id}')">🗑</button></div>
                        </div>`;
                });
                window.scrollTop = window.scrollHeight;
            });
        }
    </script>
</body>
</html>
