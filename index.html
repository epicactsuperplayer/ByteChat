<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteChat Pro | Bytestorm Corp</title>
    <style>
        :root { --rgb: #ff0000; --bg: #0a0a0a; --card: #121212; --text: #fff; }
        body.theme-emerald { --rgb: #00ff88; }
        body.theme-cyber { --rgb: #00d4ff; }
        body.theme-gold { --rgb: #ffcc00; }

        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        /* Layout */
        #auth-screen { width: 90%; max-width: 350px; text-align: center; border: 2px solid var(--rgb); padding: 30px; border-radius: 15px; box-shadow: 0 0 15px var(--rgb); }
        #main-shell { width: 100vw; height: 100vh; display: none; flex-direction: column; }
        
        @media (min-width: 768px) {
            #main-shell { width: 95vw; height: 85vh; border: 2px solid var(--rgb); border-radius: 20px; flex-direction: row; }
        }

        /* Sidebar & Mobile Menu */
        #sidebar { width: 100%; height: auto; background: #000; padding: 15px; border-bottom: 1px solid #333; display: flex; flex-direction: row; align-items: center; gap: 10px; overflow-x: auto; }
        @media (min-width: 768px) {
            #sidebar { width: 260px; height: 100%; border-bottom: none; border-right: 1px solid #333; flex-direction: column; overflow-x: hidden; }
        }

        .pfp-wrap { position: relative; width: 50px; height: 50px; flex-shrink: 0; cursor: pointer; }
        @media (min-width: 768px) { .pfp-wrap { width: 100px; height: 100px; } }
        #my-pfp { width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--rgb); object-fit: cover; }

        /* Chat */
        #chat-main { flex: 1; display: flex; flex-direction: column; background: #0e0e0e; }
        #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { display: flex; gap: 10px; }
        .msg-body { background: #1a1a1a; padding: 10px; border-radius: 10px; max-width: 80%; border-left: 3px solid var(--rgb); }
        .admin-tag { color: var(--rgb); font-weight: bold; font-size: 10px; border: 1px solid; padding: 2px 4px; border-radius: 4px; margin-left: 5px; }

        /* Inputs */
        input, select { background: #000; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 5px; width: 100%; box-sizing: border-box; }
        button { background: var(--rgb); color: #000; border: none; padding: 10px; font-weight: bold; cursor: pointer; border-radius: 5px; width: 100%; margin-top: 5px; }
        .del-btn { background: #ff4444; color: white; padding: 2px 5px; font-size: 10px; width: auto; }
        
        footer { position: fixed; bottom: 5px; width: 100%; text-align: center; font-size: 9px; opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body class="theme-default">

    <div id="auth-screen">
        <h2 id="auth-title" style="color: var(--rgb)">BYTECHAT LOGIN</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button id="auth-btn">LOGIN</button>
        <button id="google-btn" style="background:#fff">GOOGLE SIGN-IN</button>
        <p id="toggle-auth" style="font-size: 12px; margin-top: 15px; cursor: pointer;">New user? <u>Register</u></p>
    </div>

    <div id="main-shell">
        <div id="sidebar">
            <div class="pfp-wrap" onclick="document.getElementById('pfp-input').click()">
                <img id="my-pfp" src="https://via.placeholder.com/100">
                <input type="file" id="pfp-input" style="display:none" accept="image/*">
            </div>
            <div style="flex:1; display:flex; flex-direction:column; gap:5px;">
                <input type="text" id="display-name" placeholder="Name">
                <select id="theme-sel">
                    <option value="theme-default">Red RGB</option>
                    <option value="theme-emerald">Emerald</option>
                    <option value="theme-cyber">Cyber</option>
                    <option value="theme-gold">Gold</option>
                </select>
            </div>
            <button id="save-btn" style="width:auto">SAVE</button>
            <button id="admin-panel-btn" style="background:red; color:white; display:none;">ADMIN</button>
            <button id="logout-btn" style="background:#333; color:white; width:auto">X</button>
        </div>

        <div id="chat-main">
            <div id="messages"></div>
            <div style="padding: 15px; display: flex; gap: 10px; background: #000;">
                <input type="text" id="msg-input" placeholder="Message...">
                <button id="send-btn" style="width: 70px;">></button>
            </div>
        </div>
    </div>

    <footer>&copy; 2025 Bytestorm Corp. All Rights Reserved.</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCZlueIRciUi4hHxT00y0ez1jKT70ATWw",
            authDomain: "ekosecuruty.firebaseapp.com",
            projectId: "ekosecuruty",
            storageBucket: "ekosecuruty.firebasestorage.app",
            messagingSenderId: "655599032933",
            appId: "1:655599032933:web:c3c429704561672895c48c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let isSignup = false;
        let userData = {};

        // Toggle Auth
        document.getElementById('toggle-auth').onclick = () => {
            isSignup = !isSignup;
            document.getElementById('auth-title').innerText = isSignup ? "BYTECHAT REGISTER" : "BYTECHAT LOGIN";
            document.getElementById('auth-btn').innerText = isSignup ? "CREATE ACCOUNT" : "LOGIN";
            document.getElementById('toggle-auth').innerHTML = isSignup ? "Back to <u>Login</u>" : "New user? <u>Register</u>";
        };

        // Login / Signup Logic
        document.getElementById('auth-btn').onclick = async () => {
            const e = document.getElementById('email').value.trim();
            const p = document.getElementById('password').value.trim();
            if(!e || !p) return alert("Fill fields!");
            try {
                if(isSignup) await createUserWithEmailAndPassword(auth, e, p);
                else await signInWithEmailAndPassword(auth, e, p);
            } catch(err) { alert(err.message); }
        };

        document.getElementById('google-btn').onclick = () => signInWithPopup(auth, new GoogleAuthProvider());
        document.getElementById('logout-btn').onclick = () => signOut(auth);

        // Auth Listener
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-shell').style.display = 'flex';
                
                const snap = await getDoc(doc(db, "users", user.uid));
                if (snap.exists()) {
                    userData = snap.data();
                    document.getElementById('display-name').value = userData.name || "";
                    document.getElementById('my-pfp').src = userData.pfp || "https://via.placeholder.com/100";
                    document.body.className = userData.theme || "theme-default";
                    if(userData.role === 'admin' || user.email === 'Bytestorm.corp@gmail.com') {
                        document.getElementById('admin-panel-btn').style.display = 'block';
                    }
                }
                loadMsgs();
            } else {
                document.getElementById('auth-screen').style.display = 'block';
                document.getElementById('main-shell').style.display = 'none';
            }
        });

        // Profile Logic
        document.getElementById('save-btn').onclick = async () => {
            const file = document.getElementById('pfp-input').files[0];
            let url = userData.pfp || "";
            if(file) {
                const sRef = ref(storage, 'pfps/' + auth.currentUser.uid);
                await uploadBytes(sRef, file);
                url = await getDownloadURL(sRef);
            }
            await setDoc(doc(db, "users", auth.currentUser.uid), {
                name: document.getElementById('display-name').value,
                pfp: url,
                theme: document.getElementById('theme-sel').value,
                role: userData.role || 'user'
            }, {merge:true});
            alert("Saved!");
            location.reload();
        };

        // Chat Logic
        window.delMsg = (id) => deleteDoc(doc(db, "messages", id));

        function loadMsgs() {
            onSnapshot(query(collection(db, "messages"), orderBy("timestamp", "asc")), (snap) => {
                const box = document.getElementById('messages');
                box.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    const amAdmin = userData.role === 'admin' || auth.currentUser.email === 'Bytestorm.corp@gmail.com';
                    box.innerHTML += `
                        <div class="msg">
                            <img src="${m.pfp || 'https://via.placeholder.com/30'}" style="width:30px;height:30px;border-radius:50%">
                            <div class="msg-body">
                                <small style="color:var(--rgb)">${m.user}</small> ${m.isAdmin ? '<span class="admin-tag">ADMIN</span>' : ''}<br>
                                ${m.text}
                                ${amAdmin ? `<br><button class="del-btn" onclick="delMsg('${d.id}')">X</button>` : ''}
                            </div>
                        </div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        document.getElementById('send-btn').onclick = async () => {
            const val = document.getElementById('msg-input').value;
            if(!val) return;
            await addDoc(collection(db, "messages"), {
                text: val,
                user: userData.name || auth.currentUser.email.split('@')[0],
                pfp: userData.pfp || "",
                isAdmin: userData.role === 'admin' || auth.currentUser.email === 'Bytestorm.corp@gmail.com',
                timestamp: serverTimestamp()
            });
            document.getElementById('msg-input').value = "";
        };
    </script>
</body>
</html>
