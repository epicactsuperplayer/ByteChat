
<!DOCTYPE html>
<html>
<head>

<title>ByteChat</title>
<meta charset="UTF-8">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-TKJ9JKK7ZF"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-TKJ9JKK7ZF');
</script>

<style>

body{
font-family:Arial;
background:#111;
color:white;
text-align:center;
margin:0;
}

#login,#profile,#chat,#admin{
display:none;
padding:20px;
}

input{
padding:10px;
margin:5px;
border:none;
border-radius:5px;
}

button{
padding:10px 20px;
background:#00aaff;
border:none;
border-radius:5px;
color:white;
cursor:pointer;
}

#messages{
height:400px;
overflow:auto;
border:1px solid #333;
padding:10px;
margin:10px;
}

.message{
display:flex;
align-items:center;
margin:5px;
}

.message img{
width:35px;
height:35px;
border-radius:50%;
margin-right:10px;
cursor:pointer;
}

</style>

</head>

<body>

<h1>ByteChat</h1>

<!-- LOGIN PAGE -->

<div id="login">

<h2>Login</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<br>

<button onclick="login()">Login</button>
<button onclick="signup()">Signup</button>
<button onclick="googleLogin()">Google Login</button>

<br><br>

<input id="resetEmail" placeholder="Email for reset">
<button onclick="resetPassword()">Forgot Password</button>

</div>

<!-- PROFILE SETUP -->

<div id="profile">

<h2>Create Profile</h2>

<input id="name" placeholder="Your name">
<br>

<input type="file" id="pfp">

<br><br>

<button onclick="saveProfile()">Save Profile</button>

</div>

<!-- CHAT -->

<div id="chat">

<div id="messages"></div>

<input id="messageInput" placeholder="Type message">
<button onclick="sendMessage()">Send</button>

<br><br>

<button onclick="logout()">Logout</button>

</div>

<!-- ADMIN -->

<div id="admin">

<h2>Admin Panel</h2>

<button onclick="clearChat()">Delete All Messages</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
createUserWithEmailAndPassword,
signInWithPopup,
GoogleAuthProvider,
sendPasswordResetEmail,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
getDoc,
addDoc,
collection,
onSnapshot,
deleteDoc,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getStorage,
ref,
uploadBytes,
getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {

apiKey:"YOURKEY",
authDomain:"YOURPROJECT.firebaseapp.com",
projectId:"YOURPROJECT",
storageBucket:"YOURPROJECT.appspot.com",
appId:"APPID"

};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

const provider = new GoogleAuthProvider();

const loginDiv=document.getElementById("login")
const profileDiv=document.getElementById("profile")
const chatDiv=document.getElementById("chat")
const adminDiv=document.getElementById("admin")

loginDiv.style.display="block"

window.login=async()=>{

let email=email.value
let pass=password.value

await signInWithEmailAndPassword(auth,email,pass)

}

window.signup=async()=>{

let email=email.value
let pass=password.value

await createUserWithEmailAndPassword(auth,email,pass)

}

window.googleLogin=async()=>{

await signInWithPopup(auth,provider)

}

window.resetPassword=async()=>{

await sendPasswordResetEmail(auth,resetEmail.value)

alert("Password reset sent")

}

window.logout=()=>{

signOut(auth)

}

window.saveProfile=async()=>{

let name=document.getElementById("name").value
let file=document.getElementById("pfp").files[0]

let uid=auth.currentUser.uid

let storageRef=ref(storage,"pfp/"+uid)

await uploadBytes(storageRef,file)

let url=await getDownloadURL(storageRef)

await setDoc(doc(db,"users",uid),{

name:name,
pfp:url,
email:auth.currentUser.email

})

loadChat()

}

window.sendMessage=async()=>{

let text=messageInput.value

let uid=auth.currentUser.uid

let user=await getDoc(doc(db,"users",uid))

await addDoc(collection(db,"messages"),{

text:text,
uid:uid,
name:user.data().name,
pfp:user.data().pfp,
time:Date.now()

})

messageInput.value=""

}

async function loadChat(){

loginDiv.style.display="none"
profileDiv.style.display="none"
chatDiv.style.display="block"

if(auth.currentUser.email=="bytestorm.corp@gmail.com"){
adminDiv.style.display="block"
}

onSnapshot(collection(db,"messages"),snap=>{

messages.innerHTML=""

snap.forEach(d=>{

let m=d.data()

messages.innerHTML+=`
<div class="message">
<img src="${m.pfp}" onclick="alert('User: ${m.name}')">
<b>${m.name}:</b> ${m.text}
</div>
`

})

})

}

window.clearChat=async()=>{

let snap=await getDocs(collection(db,"messages"))

snap.forEach(async d=>{
await deleteDoc(d.ref)
})

}

onAuthStateChanged(auth,async user=>{

if(!user){

loginDiv.style.display="block"
chatDiv.style.display="none"

return

}

let docSnap=await getDoc(doc(db,"users",user.uid))

if(!docSnap.exists()){

loginDiv.style.display="none"
profileDiv.style.display="block"

}else{

loadChat()

}

})

</script>

</body>
</html>
