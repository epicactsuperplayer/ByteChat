<style>

<body>

<h1>ByteChat</h1>

<!-- LOGIN -->

<div id="login">

<h2>Login</h2>

<input id="email" placeholder="Email"><br>
<input id="password" type="password" placeholder="Password"><br>

<button onclick="login()">Login</button>
<button onclick="signup()">Signup</button>
<button onclick="googleLogin()">Google Login</button>

<br><br>

<input id="resetEmail" placeholder="Email for reset">
<button onclick="resetPassword()">Forgot Password</button>

</div>


<!-- PROFILE SETUP -->

<div id="profile">

<h2>Create Profile</h2>

<input id="name" placeholder="Your Name"><br>
<input type="file" id="pfp"><br><br>

<button onclick="saveProfile()">Save Profile</button>

</div>


<!-- CHAT -->

<div id="chat">

<div id="messages"></div>

<input id="messageInput" placeholder="Message">
<button onclick="sendMessage()">Send</button>

<br><br>

<button onclick="logout()">Logout</button>

</div>


<!-- ADMIN PANEL -->

<div id="admin">

<h2>Admin Panel</h2>

<button onclick="clearChat()">Delete All Messages</button>

</div>



<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-analytics.js";

import {
getAuth,
signInWithEmailAndPassword,
createUserWithEmailAndPassword,
signInWithPopup,
GoogleAuthProvider,
sendPasswordResetEmail,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
getDoc,
addDoc,
collection,
onSnapshot,
getDocs,
deleteDoc
} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

import {
getStorage,
ref,
uploadBytes,
getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-storage.js";


const firebaseConfig = {

apiKey: "AIzaSyAY49sWaN-DSKV10uyBB3CeOiABLCtFrSI",
authDomain: "bytestorm-friebase-server.firebaseapp.com",
databaseURL: "https://bytestorm-friebase-server-default-rtdb.europe-west1.firebasedatabase.app",
projectId: "bytestorm-friebase-server",
storageBucket: "bytestorm-friebase-server.firebasestorage.app",
messagingSenderId: "400056781433",
appId: "1:400056781433:web:9803b0711d85de437f62a8",
measurementId: "G-TKJ9JKK7ZF"

};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

const provider = new GoogleAuthProvider();

const loginDiv=document.getElementById("login")
const profileDiv=document.getElementById("profile")
const chatDiv=document.getElementById("chat")
const adminDiv=document.getElementById("admin")

loginDiv.style.display="block"



window.login = async function(){

let email=document.getElementById("email").value
let pass=document.getElementById("password").value

await signInWithEmailAndPassword(auth,email,pass)

}



window.signup = async function(){

let email=document.getElementById("email").value
let pass=document.getElementById("password").value

await createUserWithEmailAndPassword(auth,email,pass)

}



window.googleLogin = async function(){

await signInWithPopup(auth,provider)

}



window.resetPassword = async function(){

let email=document.getElementById("resetEmail").value

await sendPasswordResetEmail(auth,email)

alert("Reset email sent")

}



window.logout = function(){

signOut(auth)

}



window.saveProfile = async function(){

let name=document.getElementById("name").value
let file=document.getElementById("pfp").files[0]

let uid=auth.currentUser.uid

let storageRef=ref(storage,"pfp/"+uid)

await uploadBytes(storageRef,file)

let url=await getDownloadURL(storageRef)

await setDoc(doc(db,"users",uid),{
name:name,
pfp:url,
email:auth.currentUser.email
})

loadChat()

}



window.sendMessage = async function(){

let text=document.getElementById("messageInput").value

let uid=auth.currentUser.uid

let user=await getDoc(doc(db,"users",uid))

await addDoc(collection(db,"messages"),{

text:text,
name:user.data().name,
pfp:user.data().pfp,
uid:uid,
time:Date.now()

})

document.getElementById("messageInput").value=""

}



async function loadChat(){

loginDiv.style.display="none"
profileDiv.style.display="none"
chatDiv.style.display="block"

if(auth.currentUser.email=="bytestorm.corp@gmail.com"){
adminDiv.style.display="block"
}

onSnapshot(collection(db,"messages"),snap=>{

messages.innerHTML=""

snap.forEach(d=>{

let m=d.data()

messages.innerHTML+=`
<div class="msg">
<img src="${m.pfp}" onclick="alert('User: ${m.name}')">
<b>${m.name}:</b> ${m.text}
</div>
`

})

})

}



window.clearChat = async function(){

let snap=await getDocs(collection(db,"messages"))

snap.forEach(async d=>{
await deleteDoc(d.ref)
})

}



onAuthStateChanged(auth,async user=>{

if(!user){
loginDiv.style.display="block"
chatDiv.style.display="none"
return
}

let docSnap=await getDoc(doc(db,"users",user.uid))

if(!docSnap.exists()){
loginDiv.style.display="none"
profileDiv.style.display="block"
}else{
loadChat()
}

})

</script>

</body>
</html>
