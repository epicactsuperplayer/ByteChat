<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteChat | Bytestorm Corp</title>
    <style>
        :root { --rgb: #ffffff; --bg: #050505; --accent: #ff0000; --admin-glow: #00d4ff; }
        body.theme-emerald { --accent: #00ff88; }
        body.theme-cyber { --accent: #00d4ff; }

        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; height: 100vh; display: flex; overflow: hidden; flex-direction: column; }

        /* --- GLOWING LOGO --- */
        .byte-logo { 
            font-size: 24px; font-weight: 900; letter-spacing: 4px; color: #fff;
            text-shadow: 0 0 10px #fff;
            animation: pulse-glow 2s infinite alternate;
        }
        @keyframes pulse-glow { from { opacity: 0.7; } to { opacity: 1; text-shadow: 0 0 20px #fff, 0 0 30px var(--accent); } }

        /* --- MOBILE FRIENDLY LAYOUT --- */
        #main-container { display: flex; flex: 1; height: calc(100vh - 60px); overflow: hidden; }
        
        #sidebar { 
            width: 280px; background: #000; border-right: 1px solid #222; 
            display: flex; flex-direction: column; transition: 0.3s;
        }

        @media (max-width: 768px) {
            #sidebar { position: fixed; left: -280px; height: 100%; z-index: 1000; }
            #sidebar.active { left: 0; }
        }

        .top-bar { height: 60px; background: #000; border-bottom: 1px solid #222; display: flex; align-items: center; padding: 0 20px; justify-content: space-between; }

        /* --- CHAT AREA --- */
        #chat-main { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
        #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { display: flex; gap: 10px; margin-bottom: 5px; }
        .msg-pfp { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #444; object-fit: cover; }
        .msg-bubble { background: #111; padding: 10px 15px; border-radius: 15px; border-left: 3px solid var(--accent); max-width: 80%; }
        .admin-msg { border-left: 3px solid var(--admin-glow); box-shadow: 0 0 10px rgba(0, 212, 255, 0.2); }
        .user-tag { font-size: 11px; color: var(--accent); font-weight: bold; margin-bottom: 3px; display: block; }

        /* --- INPUTS & BUTTONS --- */
        .pfp-preview { width: 70px; height: 70px; border-radius: 50%; border: 2px solid #fff; margin: 10px auto; object-fit: cover; }
        input { background: #151515; color: #fff; border: 1px solid #333; padding: 10px; border-radius: 5px; width: 90%; margin: 5px auto; display: block; }
        button { background: #fff; color: #000; border: none; padding: 10px; font-weight: bold; cursor: pointer; border-radius: 5px; width: 90%; margin: 5px auto; display: block; }
        .btn-admin { background: var(--admin-glow); color: #000; }

        .footer-credits { font-size: 9px; color: #444; text-align: center; padding: 10px; line-height: 1.4; margin-top: auto; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="byte-logo">BYTESTORM</div>
        <button onclick="document.getElementById('sidebar').classList.toggle('active')" style="width:auto; margin:0; padding:5px 10px;">MENU</button>
    </div>

    <div id="main-container">
        <div id="sidebar">
            <img id="my-pfp-preview" src="https://via.placeholder.com/100" class="pfp-preview">
            
            <input type="text" id="pfp-url" placeholder="Paste PFP Image URL here...">
            <input type="text" id="display-name" placeholder="Username">
            
            <button id="save-btn">UPDATE PROFILE</button>
            
            <button id="admin-panel-btn" class="btn-admin" style="display:none;">ADMIN TERMINAL</button>
            
            <div class="footer-credits">
                © 2025 ByteChat Bytestorm Corporation.<br>
                Powered by Rodss Architecture. Made by Bytestorm<br>
                Design optimized for mobile and command efficiency.
            </div>
            
            <button id="logout-btn" style="background:#222; color:#fff;">LOGOUT</button>
        </div>

        <div id="chat-main">
            <div id="messages"></div>
            <div style="padding: 15px; display: flex; gap: 10px; background: #000;">
                <input type="text" id="msg-input" placeholder="Type a message..." style="margin: 0; flex: 1;">
                <button id="send-btn" style="width: 80px; margin: 0;">SEND</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCZlueIRciUi4hHxT00y0ez1jKT70ATWw",
            authDomain: "ekosecuruty.firebaseapp.com",
            projectId: "ekosecuruty",
            storageBucket: "ekosecuruty.firebasestorage.app",
            messagingSenderId: "655599032933",
            appId: "1:655599032933:web:c3c429704561672895c48c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let userProfile = { name: "Guest", pfp: "", role: "user" };
        const ADMIN_EMAIL = "bytestorm.corp@gmail.com";

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // FORCE ADMIN CHECK (Fixes your issue)
                const isSuperAdmin = user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
                
                const userRef = doc(db, "users", user.uid);
                const snap = await getDoc(userRef);
                
                if (snap.exists()) {
                    userProfile = snap.data();
                } else {
                    userProfile = { name: user.displayName || "User", pfp: user.photoURL || "", role: isSuperAdmin ? "admin" : "user" };
                    await setDoc(userRef, userProfile);
                }

                // If you are Bytestorm, always show admin button even if DB is slow
                if (isSuperAdmin) {
                    userProfile.role = "admin";
                    document.getElementById('admin-panel-btn').style.display = 'block';
                }

                document.getElementById('display-name').value = userProfile.name;
                document.getElementById('pfp-url').value = userProfile.pfp;
                document.getElementById('my-pfp-preview').src = userProfile.pfp || "https://via.placeholder.com/100";
                
                loadMessages();
            } else {
                signInWithPopup(auth, new GoogleAuthProvider());
            }
        });

        document.getElementById('save-btn').onclick = async () => {
            const url = document.getElementById('pfp-url').value;
            const name = document.getElementById('display-name').value;
            
            await setDoc(doc(db, "users", auth.currentUser.uid), {
                name: name,
                pfp: url,
                role: userProfile.role
            }, { merge: true });
            
            alert("Profile Synced to Cloud.");
            location.reload();
        };

        document.getElementById('send-btn').onclick = async () => {
            const val = document.getElementById('msg-input').value;
            if(!val) return;
            await addDoc(collection(db, "messages"), {
                text: val,
                userName: userProfile.name,
                userPfp: userProfile.pfp,
                isAdmin: userProfile.role === "admin",
                timestamp: serverTimestamp()
            });
            document.getElementById('msg-input').value = "";
        };

        function loadMessages() {
            onSnapshot(query(collection(db, "messages"), orderBy("timestamp", "asc")), (snap) => {
                const area = document.getElementById('messages');
                area.innerHTML = "";
                snap.forEach(doc => {
                    const m = doc.data();
                    const adminClass = m.isAdmin ? 'admin-msg' : '';
                    area.innerHTML += `
                        <div class="msg">
                            <img class="msg-pfp" src="${m.userPfp || 'https://via.placeholder.com/40'}">
                            <div class="msg-bubble ${adminClass}">
                                <span class="user-tag" style="color:${m.isAdmin ? '#00d4ff' : 'var(--accent)'}">
                                    ${m.userName} ${m.isAdmin ? '◆ ADMIN' : ''}
                                </span>
                                <div>${m.text}</div>
                            </div>
                        </div>`;
                });
                area.scrollTop = area.scrollHeight;
            });
        }

        document.getElementById('logout-btn').onclick = () => signOut(auth);
    </script>
</body>
</html>
