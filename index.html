<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ByteChat Mobile</title>
    <style>
        :root { --bg: #000; --card: #111; --accent: #fff; --admin: #00d4ff; --danger: #ff3b3b; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto; margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* --- SCREENS --- */
        .screen { display: none; flex: 1; flex-direction: column; height: 100%; padding-bottom: 70px; overflow-y: auto; }
        .active-screen { display: flex; }

        /* --- HEADER & GLOW --- */
        header { padding: 15px; border-bottom: 1px solid #222; text-align: center; background: #000; }
        .byte-logo { font-size: 20px; font-weight: 900; letter-spacing: 4px; text-shadow: 0 0 10px #fff; animation: glow 2s infinite alternate; }
        @keyframes glow { from { opacity: 0.6; } to { opacity: 1; text-shadow: 0 0 20px #fff, 0 0 30px var(--admin); } }

        /* --- CHAT BUBBLES --- */
        #chat-area { flex: 1; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg { display: flex; gap: 10px; position: relative; }
        .pfp { width: 38px; height: 38px; border-radius: 50%; border: 1px solid #333; }
        .bubble { background: var(--card); padding: 10px 14px; border-radius: 18px; max-width: 75%; font-size: 15px; border: 1px solid #222; }
        .admin-msg { border-color: var(--admin); box-shadow: 0 0 10px rgba(0, 212, 255, 0.1); }
        .tag { font-size: 10px; font-weight: bold; color: var(--admin); margin-bottom: 3px; display: block; }

        /* --- ADMIN DELETE BUTTON --- */
        .del-btn { position: absolute; right: -30px; top: 10px; color: var(--danger); font-size: 18px; cursor: pointer; display: none; }
        .is-admin .del-btn { display: block; }

        /* --- BOTTOM NAV --- */
        nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: #000; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { color: #666; font-size: 11px; text-align: center; text-decoration: none; }
        .nav-item.active { color: #fff; }

        /* --- INPUT AREA --- */
        .input-wrap { padding: 10px; display: flex; gap: 10px; background: #000; border-top: 1px solid #222; }
        input { background: #151515; color: #fff; border: 1px solid #333; padding: 12px; border-radius: 25px; flex: 1; outline: none; }
        .send-btn { background: #fff; color: #000; border: none; padding: 0 20px; border-radius: 25px; font-weight: bold; }

        /* --- ADMIN DASHBOARD --- */
        .admin-card { background: #111; margin: 15px; padding: 20px; border-radius: 15px; border: 1px solid var(--admin); }
        .btn-danger { background: var(--danger); color: #fff; width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <header><div class="byte-logo">BYTESTORM</div></header>

    <div id="screen-chat" class="screen active-screen">
        <div id="chat-area"></div>
        <div class="input-wrap">
            <input type="text" id="chat-input" placeholder="Message...">
            <button class="send-btn" id="send-btn">↑</button>
        </div>
    </div>

    <div id="screen-profile" class="screen">
        <div style="text-align:center; padding: 40px 20px;">
            <img id="my-pfp-display" src="" style="width:100px; height:100px; border-radius:50%; border:2px solid var(--admin);">
            <input type="text" id="pfp-url" placeholder="PFP URL" style="margin-top:20px;">
            <input type="text" id="user-name" placeholder="Name">
            <button onclick="saveProfile()" style="background:#fff; color:#000; border:none; padding:12px; width:90%; border-radius:10px; margin-top:10px; font-weight:bold;">SAVE CHANGES</button>
            <button onclick="logout()" style="background:transparent; color:red; border:none; margin-top:20px;">LOGOUT</button>
        </div>
    </div>

    <div id="screen-admin" class="screen">
        <div class="admin-card">
            <h3>TERMINAL ACCESS</h3>
            <p style="font-size:12px; color:#888;">Admin: bytestorm.corp@gmail.com</p>
            <button class="btn-danger" onclick="purgeChat()">PURGE ALL MESSAGES</button>
            <button onclick="alert('System alert sent.')" style="width:100%; padding:15px; margin-top:10px; border-radius:10px; border:1px solid #444; background:none; color:#fff;">SEND GLOBAL ALERT</button>
        </div>
    </div>

    <nav>
        <div class="nav-item active" onclick="showScreen('chat')">💬<br>Chat</div>
        <div class="nav-item" onclick="showScreen('profile')">👤<br>Profile</div>
        <div class="nav-item" id="nav-admin" style="display:none;" onclick="showScreen('admin')">⚡<br>Admin</div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCZlueIRciUi4hHxT00y0ez1jKT70ATWw",
            authDomain: "ekosecuruty.firebaseapp.com",
            projectId: "ekosecuruty",
            storageBucket: "ekosecuruty.firebasestorage.app",
            messagingSenderId: "655599032933",
            appId: "1:655599032933:web:c3c429704561672895c48c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_MAIL = "bytestorm.corp@gmail.com";
        let userProfile = {};

        // Navigation
        window.showScreen = (name) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById(`screen-${name}`).classList.add('active-screen');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const isAdmin = user.email.toLowerCase() === ADMIN_MAIL.toLowerCase();
                const snap = await getDoc(doc(db, "users", user.uid));
                userProfile = snap.exists() ? snap.data() : { name: user.displayName, pfp: user.photoURL, role: isAdmin ? 'admin' : 'user' };
                
                if (isAdmin) {
                    document.getElementById('nav-admin').style.display = 'block';
                    document.body.classList.add('is-admin');
                }

                document.getElementById('user-name').value = userProfile.name;
                document.getElementById('pfp-url').value = userProfile.pfp;
                document.getElementById('my-pfp-display').src = userProfile.pfp;
                loadMessages();
            } else {
                signInWithPopup(auth, new GoogleAuthProvider());
            }
        });

        // Delete Individual Message
        window.deleteMsg = async (id) => {
            if(confirm("Delete this message?")) await deleteDoc(doc(db, "messages", id));
        };

        // Purge Entire Chat
        window.purgeChat = async () => {
            if(confirm("WIPE ALL MESSAGES? This cannot be undone.")) {
                const qSnap = await getDocs(collection(db, "messages"));
                qSnap.forEach(async (d) => await deleteDoc(doc(db, "messages", d.id)));
                alert("Database Purged.");
            }
        };

        window.saveProfile = async () => {
            await setDoc(doc(db, "users", auth.currentUser.uid), {
                name: document.getElementById('user-name').value,
                pfp: document.getElementById('pfp-url').value,
                role: userProfile.role
            }, { merge: true });
            location.reload();
        };

        document.getElementById('send-btn').onclick = async () => {
            const val = document.getElementById('chat-input').value;
            if(!val) return;
            await addDoc(collection(db, "messages"), {
                text: val,
                name: userProfile.name,
                pfp: userProfile.pfp,
                isAdmin: auth.currentUser.email.toLowerCase() === ADMIN_MAIL.toLowerCase(),
                timestamp: serverTimestamp()
            });
            document.getElementById('chat-input').value = "";
        };

        function loadMessages() {
            onSnapshot(query(collection(db, "messages"), orderBy("timestamp", "asc")), (snap) => {
                const area = document.getElementById('chat-area');
                area.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    area.innerHTML += `
                        <div class="msg">
                            <img class="pfp" src="${m.pfp}">
                            <div class="bubble ${m.isAdmin ? 'admin-msg' : ''}">
                                <span class="tag">${m.name} ${m.isAdmin ? '◆' : ''}</span>
                                ${m.text}
                            </div>
                            ${auth.currentUser.email === ADMIN_MAIL ? `<span class="del-btn" onclick="deleteMsg('${d.id}')">×</span>` : ''}
                        </div>`;
                });
                area.scrollTop = area.scrollHeight;
            });
        }

        window.logout = () => signOut(auth);
    </script>
</body>
</html>
