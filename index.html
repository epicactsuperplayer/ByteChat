<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ByteChat</title>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-TKJ9JKK7ZF"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-TKJ9JKK7ZF');
</script>

<style>
body { font-family: Arial; background: #0f0f0f; color: white; text-align: center; margin: 0; }
h1 { background: #111; padding: 15px; margin: 0; }
#login, #profile, #chat, #admin { display: none; padding: 20px; }
input { padding: 10px; margin: 5px; border-radius: 6px; border: none; }
button { padding: 10px 20px; margin: 5px; border: none; border-radius: 6px; background: #00aaff; color: white; cursor: pointer; }
#messages { height: 400px; overflow-y: auto; border: 1px solid #333; margin: 10px; padding: 10px; }
.msg { display: flex; align-items: center; margin: 6px; }
.msg img { width: 35px; height: 35px; border-radius: 50%; margin-right: 8px; cursor: pointer; }
</style>
</head>

<body>
<h1>ByteChat</h1>

<div id="login">
  <h2>Login</h2>
  <input id="email" placeholder="Email"><br>
  <input id="password" type="password" placeholder="Password"><br>
  <button id="btnLogin">Login</button>
  <button id="btnSignup">Signup</button>
  <button id="btnGoogle">Google Login</button>
  <br><br>
  <input id="resetEmail" placeholder="Email for reset">
  <button id="btnReset">Forgot Password</button>
</div>

<div id="profile">
  <h2>Create Profile</h2>
  <input id="name" placeholder="Your Name"><br>
  <input type="file" id="pfp"><br><br>
  <button id="btnSaveProfile">Save Profile</button>
</div>

<div id="chat">
  <div id="messages"></div>
  <input id="messageInput" placeholder="Message">
  <button id="btnSend">Send</button>
  <br><br>
  <button id="btnLogout">Logout</button>
</div>

<div id="admin">
  <h2>Admin Panel</h2>
  <button id="btnClearChat">Delete All Messages</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-analytics.js";
import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app-check.js";
import {
  getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  signInWithPopup, GoogleAuthProvider, sendPasswordResetEmail,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc, addDoc,
  collection, onSnapshot, getDocs, deleteDoc
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
import {
  getStorage, ref, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAY49sWaN-DSKV10uyBB3CeOiABLCtFrSI",
  authDomain: "bytestorm-friebase-server.firebaseapp.com",
  databaseURL: "https://bytestorm-friebase-server-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "bytestorm-friebase-server",
  storageBucket: "bytestorm-friebase-server.firebasestorage.app",
  messagingSenderId: "400056781433",
  appId: "1:400056781433:web:9803b0711d85de437f62a8",
  measurementId: "G-TKJ9JKK7ZF"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

// App Check - must be initialized right after initializeApp
const appCheck = initializeAppCheck(app, {
  provider: new ReCaptchaV3Provider("6Lfu7ocsAAAAAFmE0hTYaL61ivTy-4gyQkhHorWE"),
  isTokenAutoRefreshEnabled: true
});

const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
const provider = new GoogleAuthProvider();

const loginDiv = document.getElementById("login");
const profileDiv = document.getElementById("profile");
const chatDiv = document.getElementById("chat");
const adminDiv = document.getElementById("admin");
const messagesDiv = document.getElementById("messages");

loginDiv.style.display = "block";

document.getElementById("btnLogin").addEventListener("click", async () => {
  try {
    const email = document.getElementById("email").value;
    const pass = document.getElementById("password").value;
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) { alert(e.message); }
});

document.getElementById("btnSignup").addEventListener("click", async () => {
  try {
    const email = document.getElementById("email").value;
    const pass = document.getElementById("password").value;
    await createUserWithEmailAndPassword(auth, email, pass);
  } catch(e) { alert(e.message); }
});

document.getElementById("btnGoogle").addEventListener("click", async () => {
  try {
    await signInWithPopup(auth, provider);
  } catch(e) { alert(e.message); }
});

document.getElementById("btnReset").addEventListener("click", async () => {
  try {
    const email = document.getElementById("resetEmail").value;
    await sendPasswordResetEmail(auth, email);
    alert("Reset email sent!");
  } catch(e) { alert(e.message); }
});

document.getElementById("btnSaveProfile").addEventListener("click", async () => {
  try {
    const name = document.getElementById("name").value;
    const file = document.getElementById("pfp").files[0];
    const uid = auth.currentUser.uid;
    const storageRef = ref(storage, "pfp/" + uid);
    await uploadBytes(storageRef, file);
    const url = await getDownloadURL(storageRef);
    await setDoc(doc(db, "users", uid), {
      name: name,
      pfp: url,
      email: auth.currentUser.email
    });
    loadChat();
  } catch(e) { alert(e.message); }
});

document.getElementById("btnSend").addEventListener("click", async () => {
  try {
    const text = document.getElementById("messageInput").value;
    if (!text.trim()) return;
    const uid = auth.currentUser.uid;
    const user = await getDoc(doc(db, "users", uid));
    await addDoc(collection(db, "messages"), {
      text: text,
      name: user.data().name,
      pfp: user.data().pfp,
      uid: uid,
      time: Date.now()
    });
    document.getElementById("messageInput").value = "";
  } catch(e) { alert(e.message); }
});

document.getElementById("btnLogout").addEventListener("click", () => signOut(auth));

document.getElementById("btnClearChat").addEventListener("click", async () => {
  try {
    const snap = await getDocs(collection(db, "messages"));
    snap.forEach(async d => await deleteDoc(d.ref));
  } catch(e) { alert(e.message); }
});

document.getElementById("messageInput").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("btnSend").click();
});

function loadChat() {
  loginDiv.style.display = "none";
  profileDiv.style.display = "none";
  chatDiv.style.display = "block";

  if (auth.currentUser.email === "bytestorm.corp@gmail.com") {
    adminDiv.style.display = "block";
  }

  onSnapshot(collection(db, "messages"), snap => {
    messagesDiv.innerHTML = "";
    const sorted = [];
    snap.forEach(d => sorted.push(d.data()));
    sorted.sort((a, b) => a.time - b.time);
    sorted.forEach(m => {
      const div = document.createElement("div");
      div.className = "msg";
      const img = document.createElement("img");
      img.src = m.pfp;
      img.title = "User: " + m.name;
      img.addEventListener("click", () => alert("User: " + m.name));
      const text = document.createElement("span");
      text.innerHTML = `<b>${m.name}:</b> ${m.text}`;
      div.appendChild(img);
      div.appendChild(text);
      messagesDiv.appendChild(div);
    });
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  });
}

onAuthStateChanged(auth, async user => {
  if (!user) {
    loginDiv.style.display = "block";
    chatDiv.style.display = "none";
    profileDiv.style.display = "none";
    return;
  }
  const docSnap = await getDoc(doc(db, "users", user.uid));
  if (!docSnap.exists()) {
    loginDiv.style.display = "none";
    profileDiv.style.display = "block";
  } else {
    loadChat();
  }
});
</script>
</body>
</html>
