<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteChat Pro | Bytestorm Corp</title>
    <style>
        :root { --rgb-speed: 3s; --primary-glow: #ff0000; --bg-color: #0a0a0a; --card-bg: #121212; --text-main: #ffffff; }
        body.theme-emerald { --primary-glow: #00ff88; }
        body.theme-cyber { --primary-glow: #00d4ff; }
        body.theme-gold { --primary-glow: #ffcc00; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        @keyframes rgb-glow { 0% { border-color: var(--primary-glow); box-shadow: 0 0 15px var(--primary-glow); } 50% { border-color: #ffffff; box-shadow: 0 0 5px #fff; } 100% { border-color: var(--primary-glow); box-shadow: 0 0 15px var(--primary-glow); } }
        #auth-screen { width: 350px; text-align: center; border: 2px solid var(--primary-glow); padding: 40px; border-radius: 20px; animation: rgb-glow 3s infinite; background: var(--card-bg); }
        #main-shell { width: 95%; max-width: 1000px; height: 85vh; background: var(--card-bg); border: 3px solid var(--primary-glow); border-radius: 20px; display: none; flex-direction: row; animation: rgb-glow var(--rgb-speed) infinite; overflow: hidden; }
        #sidebar { width: 260px; background: #000; padding: 20px; border-right: 1px solid #333; display: flex; flex-direction: column; gap: 12px; }
        .pfp-preview { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--primary-glow); object-fit: cover; align-self: center; cursor: pointer; }
        #chat-main { flex: 1; display: flex; flex-direction: column; }
        #messages-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg-bubble { display: flex; gap: 10px; align-items: flex-start; }
        .msg-content { background: #1e1e1e; padding: 10px; border-radius: 12px; max-width: 70%; border-left: 3px solid var(--primary-glow); }
        input, select { background: #000; color: white; border: 1px solid #444; padding: 10px; border-radius: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        button { background: var(--primary-glow); color: black; border: none; padding: 12px; cursor: pointer; font-weight: bold; border-radius: 8px; width: 100%; margin-bottom: 5px; }
        footer { position: fixed; bottom: 10px; font-size: 10px; opacity: 0.6; text-align: center; width: 100%; pointer-events: none; }
        .admin-tag { color: var(--primary-glow); font-size: 9px; font-weight: bold; border: 1px solid; padding: 1px 4px; border-radius: 4px; margin-left: 5px; }
    </style>
</head>
<body class="theme-default">

    <div id="auth-screen">
        <h1 id="form-title" style="color: var(--primary-glow)">BYTECHAT LOGIN</h1>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        
        <button type="button" id="main-auth-btn">LOGIN</button>
        <button type="button" id="google-btn" style="background: #fff;">GOOGLE SIGN-IN</button>
        
        <p id="toggle-text" style="cursor:pointer; font-size: 11px; margin-top: 15px;">
            Need an account? <span style="text-decoration: underline; color: var(--primary-glow)">Register here</span>
        </p>
    </div>

    <div id="main-shell">
        <div id="sidebar">
            <img id="my-pfp" class="pfp-preview" src="https://via.placeholder.com/80" onclick="document.getElementById('pfp-input').click()">
            <input type="file" id="pfp-input" style="display:none" accept="image/*">
            <input type="text" id="display-name" placeholder="Display Name">
            <select id="theme-selector">
                <option value="theme-default">Red RGB</option>
                <option value="theme-emerald">Emerald</option>
                <option value="theme-cyber">Cyber</option>
                <option value="theme-gold">Gold</option>
            </select>
            <button id="save-profile">SAVE PROFILE</button>
            <button id="admin-btn" style="background:red; display:none;">ADMIN PANEL</button>
            <button id="logout-btn" style="background:#333; color:white;">LOGOUT</button>
        </div>
        <div id="chat-main">
            <div id="messages-area"></div>
            <div style="padding: 20px; display: flex; gap: 10px;">
                <input type="text" id="msg-input" placeholder="Message..." style="margin:0">
                <button id="send-btn" style="width: 80px; margin:0">SEND</button>
            </div>
        </div>
    </div>

    <footer>&copy; 2025 Bytestorm Corp. All Rights Reserved.</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCZlueIRciUi4hHxT00y0ez1jKT70ATWw",
            authDomain: "ekosecuruty.firebaseapp.com",
            projectId: "ekosecuruty",
            storageBucket: "ekosecuruty.firebasestorage.app",
            messagingSenderId: "655599032933",
            appId: "1:655599032933:web:c3c429704561672895c48c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let isRegisterMode = false;
        let userData = {};

        // TOGGLE LOGIN/SIGNUP
        document.getElementById('toggle-text').onclick = () => {
            isRegisterMode = !isRegisterMode;
            document.getElementById('form-title').innerText = isRegisterMode ? "BYTECHAT REGISTER" : "BYTECHAT LOGIN";
            document.getElementById('main-auth-btn').innerText = isRegisterMode ? "CREATE ACCOUNT" : "LOGIN";
            document.getElementById('toggle-text').innerHTML = isRegisterMode ? "Already have an account? <u>Login</u>" : "Need an account? <u>Register here</u>";
        };

        // AUTH ACTIONS
        document.getElementById('main-auth-btn').onclick = async () => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value.trim();
            if(!email || !pass) return alert("Fill in all fields!");

            try {
                if(isRegisterMode) {
                    await createUserWithEmailAndPassword(auth, email, pass);
                    alert("Account created!");
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
            } catch(e) { alert(e.message); }
        };

        document.getElementById('google-btn').onclick = () => signInWithPopup(auth, new GoogleAuthProvider());
        document.getElementById('logout-btn').onclick = () => signOut(auth);

        // APP STATE
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-shell').style.display = 'flex';
                
                const snap = await getDoc(doc(db, "users", user.uid));
                if (snap.exists()) {
                    userData = snap.data();
                    document.getElementById('display-name').value = userData.name || "";
                    document.getElementById('my-pfp').src = userData.pfp || "https://via.placeholder.com/80";
                    document.body.className = userData.theme || "theme-default";
                    if (userData.role === "admin" || user.email === "Bytestorm.corp@gmail.com") {
                        document.getElementById('admin-btn').style.display = 'block';
                    }
                }
                loadMessages();
            } else {
                document.getElementById('auth-screen').style.display = 'block';
                document.getElementById('main-shell').style.display = 'none';
            }
        });

        // PROFILE SAVE
        document.getElementById('save-profile').onclick = async () => {
            const file = document.getElementById('pfp-input').files[0];
            let url = userData.pfp || "";
            if(file) {
                const r = ref(storage, 'pfps/'+auth.currentUser.uid);
                await uploadBytes(r, file);
                url = await getDownloadURL(r);
            }
            await setDoc(doc(db, "users", auth.currentUser.uid), {
                name: document.getElementById('display-name').value,
                pfp: url,
                theme: document.getElementById('theme-selector').value,
                role: userData.role || "user"
            }, {merge:true});
            alert("Updated!");
        };

        // CHAT
        window.deleteMsg = (id) => deleteDoc(doc(db, "messages", id));

        function loadMessages() {
            onSnapshot(query(collection(db, "messages"), orderBy("timestamp", "asc")), (snap) => {
                const area = document.getElementById('messages-area');
                area.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    const isMeAdmin = userData.role === 'admin' || auth.currentUser.email === 'Bytestorm.corp@gmail.com';
                    area.innerHTML += `
                        <div class="msg-bubble">
                            <img src="${m.pfp || 'https://via.placeholder.com/30'}" style="width:30px;height:30px;border-radius:50%">
                            <div class="msg-content">
                                <b>${m.user}</b> ${m.isAdmin ? '<span class="admin-tag">ADMIN</span>' : ''}<br>${m.text}
                                ${isMeAdmin ? `<br><button onclick="deleteMsg('${d.id}')" style="font-size:8px; width:auto; padding:2px; background:red; color:white;">DELETE</button>` : ''}
                            </div>
                        </div>`;
                });
                area.scrollTop = area.scrollHeight;
            });
        }

        document.getElementById('send-btn').onclick = async () => {
            const inp = document.getElementById('msg-input');
            if(!inp.value) return;
            await addDoc(collection(db, "messages"), {
                text: inp.value,
                user: userData.name || auth.currentUser.email.split('@')[0],
                pfp: userData.pfp || "",
                uid: auth.currentUser.uid,
                isAdmin: userData.role === 'admin' || auth.currentUser.email === 'Bytestorm.corp@gmail.com',
                timestamp: serverTimestamp()
            });
            inp.value = "";
        };
    </script>
</body>
</html>
