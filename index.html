<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteChat | Bytestorm Corp</title>
    <style>
        :root { --rgb: #ffffff; --bg: #050505; --accent: #ff0000; --admin: #00d4ff; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* --- GLOWING LOGO --- */
        .byte-logo { 
            font-size: 22px; font-weight: 900; letter-spacing: 3px; color: #fff;
            text-shadow: 0 0 10px #fff; animation: pulse 2s infinite alternate;
        }
        @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; text-shadow: 0 0 20px #fff, 0 0 30px var(--admin); } }

        /* --- LAYOUT --- */
        .top-bar { height: 60px; border-bottom: 1px solid #222; display: flex; align-items: center; padding: 0 20px; justify-content: space-between; background: #000; z-index: 1001; }
        #main-shell { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        #sidebar { 
            width: 280px; background: #000; border-right: 1px solid #222; 
            display: flex; flex-direction: column; transition: 0.3s;
        }

        @media (max-width: 768px) {
            #sidebar { position: absolute; left: -280px; height: 100%; z-index: 1000; }
            #sidebar.active { left: 0; }
        }

        /* --- MESSAGES & TAGS --- */
        #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { display: flex; gap: 10px; }
        .msg-pfp { width: 42px; height: 42px; border-radius: 50%; border: 1px solid #444; object-fit: cover; }
        .msg-bubble { background: #111; padding: 10px 15px; border-radius: 15px; border-left: 3px solid var(--accent); max-width: 80%; }
        .admin-bubble { border-left: 3px solid var(--admin); box-shadow: 0 0 10px rgba(0, 212, 255, 0.1); }
        .tag { font-size: 11px; font-weight: bold; margin-bottom: 4px; display: block; }
        .admin-badge { background: var(--admin); color: #000; padding: 1px 6px; border-radius: 3px; font-size: 9px; margin-left: 6px; vertical-align: middle; }

        /* --- BUTTONS --- */
        input { background: #151515; color: #fff; border: 1px solid #333; padding: 12px; border-radius: 8px; width: 90%; margin: 5px auto; display: block; }
        button { background: #fff; color: #000; border: none; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 8px; width: 90%; margin: 10px auto; display: block; }
        .btn-terminal { background: var(--admin); color: #000; display: none; }

        .footer { font-size: 9px; color: #444; text-align: center; padding: 15px; line-height: 1.4; margin-top: auto; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="byte-logo">BYTESTORM</div>
        <button onclick="document.getElementById('sidebar').classList.toggle('active')" style="width:auto; margin:0; padding:5px 15px;">MENU</button>
    </div>

    <div id="main-shell">
        <div id="sidebar">
            <img id="my-pfp" src="https://via.placeholder.com/100" style="width:80px; height:80px; border-radius:50%; margin:20px auto; border:2px solid #fff; object-fit:cover;">
            <input type="text" id="pfp-url" placeholder="PFP Link (URL)">
            <input type="text" id="user-name" placeholder="Display Name">
            <button id="save-profile">SYNC SYSTEM</button>
            
            <button id="admin-panel-btn" class="btn-terminal">ADMIN TERMINAL</button>
            
            <div class="footer">
                © 2025 ByteChat Bytestorm Corporation. Powered by Rodss Architecture.<br>
                Made by Bytestorm | Design optimized for mobile.
            </div>
            <button id="logout-btn" style="background:#222; color:#fff;">LOGOUT</button>
        </div>

        <div style="flex:1; display:flex; flex-direction:column; background:var(--bg);">
            <div id="messages"></div>
            <div style="padding:15px; background:#000; display:flex; gap:10px;">
                <input type="text" id="chat-input" placeholder="Enter message..." style="margin:0; flex:1;">
                <button id="send-btn" style="width:80px; margin:0;">SEND</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCZlueIRciUi4hHxT00y0ez1jKT70ATWw",
            authDomain: "ekosecuruty.firebaseapp.com",
            projectId: "ekosecuruty",
            storageBucket: "ekosecuruty.firebasestorage.app",
            messagingSenderId: "655599032933",
            appId: "1:655599032933:web:c3c429704561672895c48c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let myProfile = { name: "User", pfp: "", role: "user" };
        const ADMIN_MAIL = "bytestorm.corp@gmail.com";

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const isBytestorm = user.email.toLowerCase() === ADMIN_MAIL.toLowerCase();
                const snap = await getDoc(doc(db, "users", user.uid));
                
                if (snap.exists()) {
                    myProfile = snap.data();
                } else {
                    myProfile = { name: user.displayName || "ByteUser", pfp: user.photoURL || "", role: isBytestorm ? "admin" : "user" };
                    await setDoc(doc(db, "users", user.uid), myProfile);
                }

                if (isBytestorm) {
                    myProfile.role = "admin";
                    document.getElementById('admin-panel-btn').style.display = 'block';
                }

                document.getElementById('user-name').value = myProfile.name;
                document.getElementById('pfp-url').value = myProfile.pfp;
                document.getElementById('my-pfp').src = myProfile.pfp || "https://via.placeholder.com/100";
                loadMessages();
            } else {
                signInWithPopup(auth, new GoogleAuthProvider());
            }
        });

        document.getElementById('send-btn').onclick = async () => {
            const text = document.getElementById('chat-input').value;
            if(!text) return;

            // CRITICAL FIX: Ensure the admin boolean is sent to the DB
            const isBytestorm = auth.currentUser.email.toLowerCase() === ADMIN_MAIL.toLowerCase();

            await addDoc(collection(db, "messages"), {
                text: text,
                senderName: myProfile.name,
                senderPfp: myProfile.pfp,
                isAdminMsg: isBytestorm, // This saves the tag for ALL users
                timestamp: serverTimestamp()
            });
            document.getElementById('chat-input').value = "";
        };

        function loadMessages() {
            onSnapshot(query(collection(db, "messages"), orderBy("timestamp", "asc")), (snap) => {
                const area = document.getElementById('messages');
                area.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    const adminStyle = m.isAdminMsg ? 'admin-bubble' : '';
                    const tagColor = m.isAdminMsg ? 'var(--admin)' : 'var(--accent)';
                    
                    area.innerHTML += `
                        <div class="msg">
                            <img class="msg-pfp" src="${m.senderPfp || 'https://via.placeholder.com/40'}">
                            <div class="msg-bubble ${adminStyle}">
                                <span class="tag" style="color:${tagColor}">
                                    ${m.senderName} ${m.isAdminMsg ? '<span class="admin-badge">ADMIN</span>' : ''}
                                </span>
                                <div>${m.text}</div>
                            </div>
                        </div>`;
                });
                area.scrollTop = area.scrollHeight;
            });
        }

        // TERMINAL LOGIC
        document.getElementById('admin-panel-btn').onclick = () => {
            const command = prompt("TERMINAL ACCESS GRANTED.\nCommands: clear (wipes local view) | alert (broadcast)");
            if(command === "clear") {
                document.getElementById('messages').innerHTML = "";
                alert("Visual Purge Complete.");
            }
        };

        document.getElementById('save-profile').onclick = async () => {
            await setDoc(doc(db, "users", auth.currentUser.uid), {
                name: document.getElementById('user-name').value,
                pfp: document.getElementById('pfp-url').value,
                role: myProfile.role
            }, { merge: true });
            location.reload();
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth);
    </script>
</body>
</html>
