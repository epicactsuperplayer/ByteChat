<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteChat Pro | Bytestorm Corp</title>
    <style>
        :root { --rgb: #ff0000; --bg: #0a0a0a; --card: #121212; --text: #fff; }
        body.theme-emerald { --rgb: #00ff88; }
        body.theme-cyber { --rgb: #00d4ff; }
        body.theme-gold { --rgb: #ffcc00; }

        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        #auth-screen { width: 90%; max-width: 350px; text-align: center; border: 2px solid var(--rgb); padding: 30px; border-radius: 15px; background: var(--card); box-shadow: 0 0 20px var(--rgb); }
        #main-shell { width: 100vw; height: 100vh; display: none; flex-direction: column; }
        @media (min-width: 768px) { #main-shell { width: 95vw; height: 85vh; border: 2px solid var(--rgb); border-radius: 20px; flex-direction: row; } }

        #sidebar { width: 100%; background: #000; padding: 15px; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 10px; box-sizing: border-box; }
        @media (min-width: 768px) { #sidebar { width: 260px; height: 100%; border-bottom: none; border-right: 1px solid #333; flex-direction: column; padding: 25px; } }

        #my-pfp { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--rgb); cursor: pointer; object-fit: cover; transition: 0.3s; }
        #my-pfp:hover { opacity: 0.7; transform: scale(1.05); }

        #chat-main { flex: 1; display: flex; flex-direction: column; background: #0a0a0a; position: relative; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        .msg { display: flex; gap: 12px; align-items: flex-start; }
        .msg-pfp { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--rgb); }
        .msg-bubble { background: #1a1a1a; padding: 12px; border-radius: 12px; max-width: 80%; border-left: 3px solid var(--rgb); }
        .user-name { font-size: 13px; color: var(--rgb); font-weight: bold; }
        .admin-tag { font-size: 9px; background: var(--rgb); color: #000; padding: 1px 5px; border-radius: 4px; margin-left: 5px; }

        /* Admin Dashboard Overlay */
        #admin-dash { display: none; position: absolute; inset: 0; background: #000; z-index: 50; padding: 30px; overflow-y: auto; border-radius: 15px; }
        .dash-card { background: #111; border: 1px solid var(--rgb); padding: 15px; border-radius: 10px; margin-bottom: 10px; }

        input, select { background: #000; color: #fff; border: 1px solid #444; padding: 12px; border-radius: 8px; width: 100%; margin-bottom: 12px; box-sizing: border-box; }
        button { background: var(--rgb); color: #000; border: none; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 8px; width: 100%; }
        .btn-outline { background: transparent; color: var(--rgb); border: 1px solid var(--rgb); margin-top: 5px; }

        footer { position: fixed; bottom: 8px; font-size: 10px; opacity: 0.5; color: #fff; text-align: center; width: 100%; z-index: -1; }
    </style>
</head>
<body class="theme-default">

    <div id="auth-screen">
        <h2 style="color: var(--rgb)">BYTECHAT</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button id="auth-btn">PROCEED</button>
        <button id="google-btn" style="background:#fff; margin-top: 10px; color:#000;">GOOGLE LOGIN</button>
        <p id="toggle-auth" style="font-size: 11px; margin-top: 15px; cursor: pointer;">Register / Login Toggle</p>
    </div>

    <div id="main-shell">
        <div id="sidebar">
            <div style="position: relative;">
                <img id="my-pfp" src="https://via.placeholder.com/100" onclick="document.getElementById('pfp-input').click()">
                <div style="position:absolute; bottom:0; right:0; background:var(--rgb); color:#000; font-size:10px; padding:2px 5px; border-radius:5px;">EDIT</div>
            </div>
            <input type="file" id="pfp-input" style="display:none" accept="image/*">
            
            <input type="text" id="display-name-input" placeholder="Display Name">
            <select id="theme-sel">
                <option value="theme-default">Standard Red</option>
                <option value="theme-emerald">Emerald Green</option>
                <option value="theme-cyber">Cyber Blue</option>
                <option value="theme-gold">Gold Edition</option>
            </select>
            
            <button id="save-profile">SAVE PROFILE</button>
            
            <button id="admin-dash-btn" class="btn-outline" style="display:none; border-color: #ff00ff; color: #ff00ff;">SERVER CONTROL</button>
            <button id="logout-btn" style="background:#222; color:white; margin-top: auto;">LOGOUT</button>
        </div>

        <div id="chat-main">
            <div id="admin-dash">
                <div style="display:flex; justify-content: space-between; align-items: center;">
                    <h2 style="color:var(--rgb)">ADMIN DASHBOARD</h2>
                    <button onclick="document.getElementById('admin-dash').style.display='none'" style="width:auto; padding:5px 15px;">CLOSE</button>
                </div>
                <div id="admin-stats" class="dash-card">
                    <h3>Server Stats</h3>
                    <p id="user-count">Loading user info...</p>
                </div>
                <div id="admin-logs" class="dash-card">
                    <h3>Recent Global Activity</h3>
                    <div id="log-content" style="font-family: monospace; font-size: 11px;"></div>
                </div>
            </div>

            <div id="messages"></div>
            <div style="padding: 20px; display: flex; gap: 10px; background: #050505; border-top: 1px solid #222;">
                <input type="text" id="msg-input" placeholder="Type here..." style="margin:0">
                <button id="send-btn" style="width: 80px; margin:0">SEND</button>
            </div>
        </div>
    </div>

    <footer>&copy; 2025 Bytestorm Corp.</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, deleteDoc, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCZlueIRciUi4hHxT00y0ez1jKT70ATWw",
            authDomain: "ekosecuruty.firebaseapp.com",
            projectId: "ekosecuruty",
            storageBucket: "ekosecuruty.firebasestorage.app",
            messagingSenderId: "655599032933",
            appId: "1:655599032933:web:c3c429704561672895c48c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let isSignup = false;
        let currentUserData = { name: "", pfp: "", role: "user" };

        // Handle File Selection Preview Immediately
        document.getElementById('pfp-input').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => document.getElementById('my-pfp').src = event.target.result;
                reader.readAsDataURL(file);
            }
        };

        document.getElementById('toggle-auth').onclick = () => {
            isSignup = !isSignup;
            document.getElementById('auth-btn').innerText = isSignup ? "SIGN UP" : "LOGIN";
        };

        document.getElementById('auth-btn').onclick = async () => {
            const e = document.getElementById('email').value.trim();
            const p = document.getElementById('password').value;
            try {
                if(isSignup) await createUserWithEmailAndPassword(auth, e, p);
                else await signInWithEmailAndPassword(auth, e, p);
            } catch(err) { alert(err.message); }
        };

        document.getElementById('google-btn').onclick = () => signInWithPopup(auth, new GoogleAuthProvider());
        document.getElementById('logout-btn').onclick = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-shell').style.display = 'flex';
                
                const snap = await getDoc(doc(db, "users", user.uid));
                if (snap.exists()) {
                    currentUserData = snap.data();
                } else {
                    currentUserData = { name: user.displayName || user.email.split('@')[0], pfp: user.photoURL || "", role: "user" };
                }

                if (user.email.toLowerCase().includes("bytestorm.corp")) {
                    currentUserData.role = "admin";
                    document.getElementById('admin-dash-btn').style.display = 'block';
                }

                document.getElementById('display-name-input').value = currentUserData.name;
                document.getElementById('my-pfp').src = currentUserData.pfp || "https://via.placeholder.com/100";
                document.body.className = currentUserData.theme || "theme-default";
                loadMessages();
            } else {
                document.getElementById('auth-screen').style.display = 'block';
                document.getElementById('main-shell').style.display = 'none';
            }
        });

        document.getElementById('save-profile').onclick = async () => {
            const btn = document.getElementById('save-profile');
            btn.innerText = "UPLOADING...";
            const user = auth.currentUser;
            const file = document.getElementById('pfp-input').files[0];
            let url = currentUserData.pfp || "";

            if (file) {
                const imgRef = ref(storage, `pfps/${user.uid}`);
                await uploadBytes(imgRef, file);
                url = await getDownloadURL(imgRef);
            }

            const profile = {
                name: document.getElementById('display-name-input').value,
                pfp: url,
                theme: document.getElementById('theme-sel').value,
                role: user.email.toLowerCase().includes("bytestorm.corp") ? "admin" : "user"
            };

            await setDoc(doc(db, "users", user.uid), profile, { merge: true });
            btn.innerText = "SAVED!";
            setTimeout(() => location.reload(), 1000);
        };

        // ADMIN PANEL LOGIC
        document.getElementById('admin-dash-btn').onclick = () => {
            document.getElementById('admin-dash').style.display = 'block';
            const logBox = document.getElementById('log-content');
            logBox.innerHTML = "Tracing active streams...";
            onSnapshot(query(collection(db, "messages"), orderBy("timestamp", "desc"), limit(10)), (s) => {
                logBox.innerHTML = "";
                s.forEach(d => {
                    logBox.innerHTML += `<div>[${d.data().userName}]: ${d.data().text.substring(0, 20)}...</div>`;
                });
            });
        };

        document.getElementById('send-btn').onclick = async () => {
            const val = document.getElementById('msg-input').value;
            if(!val) return;
            await addDoc(collection(db, "messages"), {
                text: val,
                userName: currentUserData.name || auth.currentUser.email.split('@')[0],
                userPfp: currentUserData.pfp || "",
                isAdmin: currentUserData.role === "admin",
                timestamp: serverTimestamp()
            });
            document.getElementById('msg-input').value = "";
        };

        function loadMessages() {
            onSnapshot(query(collection(db, "messages"), orderBy("timestamp", "asc")), (snap) => {
                const area = document.getElementById('messages');
                area.innerHTML = "";
                snap.forEach(dSnap => {
                    const m = dSnap.data();
                    const isMeAdmin = currentUserData.role === "admin";
                    area.innerHTML += `
                        <div class="msg">
                            <img class="msg-pfp" src="${m.userPfp || 'https://via.placeholder.com/40'}">
                            <div class="msg-bubble">
                                <span class="user-name">${m.userName} ${m.isAdmin ? '<span class="admin-tag">ADMIN</span>' : ''}</span>
                                <div>${m.text}</div>
                                ${isMeAdmin ? `<button style="background:red; color:white; font-size:9px; width:auto; padding:2px 5px; margin-top:5px;" onclick="window.deleteMsg('${dSnap.id}')">DELETE</button>` : ''}
                            </div>
                        </div>`;
                });
                area.scrollTop = area.scrollHeight;
            });
        }

        window.deleteMsg = (id) => deleteDoc(doc(db, "messages", id));
        document.getElementById('theme-sel').onchange = (e) => document.body.className = e.target.value;
    </script>
</body>
</html>
