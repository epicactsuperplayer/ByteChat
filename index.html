<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteChat | Bytestorm Corp</title>
    <style>
        :root { --rgb: #ffffff; --bg: #050505; --card: #111; --accent: #ff0000; }
        body.theme-emerald { --accent: #00ff88; }
        body.theme-cyber { --accent: #00d4ff; }

        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; height: 100vh; display: flex; overflow: hidden; }

        /* --- GLOWING LOGO --- */
        .logo-container { padding: 20px; text-align: center; }
        .byte-logo { 
            font-size: 28px; font-weight: 900; letter-spacing: 5px; color: #fff;
            text-shadow: 0 0 10px #fff, 0 0 20px #fff;
            animation: pulse-glow 2s infinite alternate;
        }
        @keyframes pulse-glow { 
            from { opacity: 0.8; text-shadow: 0 0 5px #fff; } 
            to { opacity: 1; text-shadow: 0 0 20px #fff, 0 0 30px var(--accent); } 
        }

        /* --- RESPONSIVE LAYOUT --- */
        #sidebar { 
            width: 280px; height: 100vh; background: #000; border-right: 1px solid #222; 
            display: flex; flex-direction: column; transition: 0.3s; z-index: 1000;
        }
        
        /* Mobile Sidebar Toggle */
        @media (max-width: 768px) {
            #sidebar { position: fixed; left: -280px; }
            #sidebar.active { left: 0; }
            .mobile-nav { display: block !important; }
        }

        .mobile-nav { 
            display: none; background: #000; padding: 15px; border-bottom: 1px solid #222; 
            position: fixed; top: 0; width: 100%; z-index: 999; 
        }

        #chat-main { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; margin-top: 60px; } /* Margin for mobile top bar */
        @media (min-width: 769px) { #messages { margin-top: 0; } }

        /* --- UI ELEMENTS --- */
        .pfp-preview { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #fff; margin: 10px auto; object-fit: cover; box-shadow: 0 0 15px var(--accent); }
        input, select { background: #151515; color: #fff; border: 1px solid #333; padding: 12px; border-radius: 8px; width: 90%; margin: 5px auto; display: block; }
        button { background: #fff; color: #000; border: none; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 8px; width: 90%; margin: 10px auto; display: block; transition: 0.3s; }
        button:hover { transform: scale(0.98); box-shadow: 0 0 15px #fff; }

        /* --- MESSAGES --- */
        .msg { display: flex; gap: 12px; margin-bottom: 15px; align-items: flex-start; }
        .msg-pfp { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #fff; flex-shrink: 0; }
        .msg-bubble { background: #151515; padding: 10px 15px; border-radius: 12px; border-left: 3px solid var(--accent); max-width: 80%; }
        .user-tag { font-size: 11px; color: var(--accent); font-weight: bold; }

        /* --- FOOTER --- */
        .credits { font-size: 9px; color: #444; text-align: center; padding: 10px; line-height: 1.5; }
    </style>
</head>
<body class="theme-default">

    <div class="mobile-nav">
        <button onclick="toggleSidebar()" style="width: auto; margin: 0; display: inline-block; padding: 5px 15px;">MENU</button>
        <span class="byte-logo" style="font-size: 18px; margin-left: 20px;">BYTESTORM</span>
    </div>

    <div id="sidebar">
        <div class="logo-container">
            <div class="byte-logo">BYTESTORM</div>
        </div>

        <img id="my-pfp-preview" src="https://via.placeholder.com/100" class="pfp-preview">
        
        <label style="font-size:10px; margin-left:15px; color:#666;">PFP IMAGE URL</label>
        <input type="text" id="pfp-url-input" placeholder="https://image-link.com/photo.jpg">
        
        <label style="font-size:10px; margin-left:15px; color:#666;">DISPLAY NAME</label>
        <input type="text" id="display-name" placeholder="Name">
        
        <select id="theme-sel">
            <option value="theme-default">White/Red</option>
            <option value="theme-emerald">Emerald</option>
            <option value="theme-cyber">Cyber Blue</option>
        </select>

        <button id="save-btn">SYNC PROFILE</button>
        <button id="admin-btn" style="display:none; background:var(--accent); color:#fff;">TERMINAL</button>
        
        <div class="credits">
            © 2025 ByteChat Bytestorm Corporation.<br>
            Powered by Rodss Architecture. Made by Bytestorm<br>
            Design optimized for mobile and command efficiency.
        </div>
        
        <button id="logout-btn" style="background:#222; color:#fff; margin-top: auto;">LOGOUT</button>
    </div>

    <div id="chat-main">
        <div id="messages"></div>
        
        <div style="padding: 15px; background: #000; border-top: 1px solid #222; display: flex; gap: 10px;">
            <input type="text" id="chat-input" placeholder="Command..." style="margin: 0; flex: 1;">
            <button id="send-btn" style="width: 80px; margin: 0;">SEND</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCZlueIRciUi4hHxT00y0ez1jKT70ATWw",
            authDomain: "ekosecuruty.firebaseapp.com",
            projectId: "ekosecuruty",
            storageBucket: "ekosecuruty.firebasestorage.app",
            messagingSenderId: "655599032933",
            appId: "1:655599032933:web:c3c429704561672895c48c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let myData = { name: "", pfp: "", role: "user" };

        // Sidebar Toggle for Mobile
        window.toggleSidebar = () => document.getElementById('sidebar').classList.toggle('active');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snap = await getDoc(doc(db, "users", user.uid));
                if (snap.exists()) {
                    myData = snap.data();
                } else {
                    myData = { name: user.displayName || "User", pfp: user.photoURL || "", role: "user" };
                    await setDoc(doc(db, "users", user.uid), myData);
                }

                if (user.email.toLowerCase().includes("bytestorm.corp")) {
                    myData.role = "admin";
                    document.getElementById('admin-btn').style.display = 'block';
                }

                document.getElementById('display-name').value = myData.name;
                document.getElementById('pfp-url-input').value = myData.pfp;
                document.getElementById('my-pfp-preview').src = myData.pfp || "https://via.placeholder.com/100";
                loadMessages();
            } else {
                // If not logged in, trigger Google Login instantly
                signInWithPopup(auth, new GoogleAuthProvider());
            }
        });

        document.getElementById('save-btn').onclick = async () => {
            const updated = {
                name: document.getElementById('display-name').value,
                pfp: document.getElementById('pfp-url-input').value,
                theme: document.getElementById('theme-sel').value,
                role: myData.role
            };
            await setDoc(doc(db, "users", auth.currentUser.uid), updated, { merge: true });
            location.reload();
        };

        document.getElementById('send-btn').onclick = async () => {
            const txt = document.getElementById('chat-input').value;
            if(!txt) return;
            await addDoc(collection(db, "messages"), {
                text: txt,
                userName: myData.name,
                userPfp: myData.pfp,
                isAdmin: myData.role === "admin",
                timestamp: serverTimestamp()
            });
            document.getElementById('chat-input').value = "";
        };

        function loadMessages() {
            onSnapshot(query(collection(db, "messages"), orderBy("timestamp", "asc")), (snap) => {
                const area = document.getElementById('messages');
                area.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    area.innerHTML += `
                        <div class="msg">
                            <img class="msg-pfp" src="${m.userPfp || 'https://via.placeholder.com/40'}">
                            <div class="msg-bubble">
                                <span class="user-tag">${m.userName} ${m.isAdmin ? '[ADMIN]' : ''}</span>
                                <div>${m.text}</div>
                            </div>
                        </div>`;
                });
                area.scrollTop = area.scrollHeight;
            });
        }

        document.getElementById('logout-btn').onclick = () => signOut(auth);
    </script>
</body>
</html>
