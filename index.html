<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ByteChat | Secured</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-deep: #050505;
            --bg-surface: #0a0a0a;
            --admin-neon: #00d4ff;
            --danger: #ff3b3b;
            --text-main: #f0f0f0;
            --sidebar-width: 280px;
            --nav-height: 80px;
        }

        /* --- RGB LOGO ANIMATION --- */
        @keyframes rgbFlow {
            0% { color: #ff0000; text-shadow: 0 0 15px #ff0000; }
            33% { color: #00ff00; text-shadow: 0 0 15px #00ff00; }
            66% { color: #0000ff; text-shadow: 0 0 15px #0000ff; }
            100% { color: #ff0000; text-shadow: 0 0 15px #ff0000; }
        }

        .rgb-logo {
            animation: rgbFlow 4s infinite linear;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-size: 28px;
            text-align: center;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; }

        /* --- AUTH SCREEN (LOGIN PAGE) --- */
        #auth-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-deep);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-card {
            text-align: center;
            padding: 40px;
            background: var(--bg-surface);
            border: 1px solid #1a1a1a;
            border-radius: 20px;
            max-width: 400px;
            width: 90%;
        }

        .btn-login {
            background: #fff;
            color: #000;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 30px;
            width: 100%;
            transition: 0.3s;
        }

        /* --- APP SHELL --- */
        #app-shell { display: none; width: 100vw; height: 100vh; }
        body.logged-in #app-shell { display: flex; }
        body.logged-in #auth-screen { display: none; }

        #sidebar {
            width: var(--sidebar-width);
            background: var(--bg-surface);
            border-right: 1px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            padding: 25px;
            flex-shrink: 0;
        }

        #viewport { flex-grow: 1; display: flex; flex-direction: column; position: relative; min-width: 0; }

        /* --- MOBILE STYLES --- */
        @media (max-width: 850px) {
            #sidebar { display: none !important; }
            .mobile-nav { display: flex !important; }
            #messages-container { padding: 15px 15px 180px 15px !important; }
            .footer-credits { font-size: 8px !important; bottom: 95px !important; opacity: 0.5; }
        }

        .admin-only { display: none !important; }
        .is-master .admin-only { display: flex !important; }

        #messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .msg-row { display: flex; gap: 12px; max-width: 90%; align-items: flex-start; margin-bottom: 5px; }
        .msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
        .chat-pfp { width: 38px; height: 38px; border-radius: 50%; border: 1px solid #222; object-fit: cover; }
        .bubble { background: #111; padding: 12px 16px; border-radius: 18px; border: 1px solid #222; }
        .admin-glow { border-color: var(--admin-neon); box-shadow: 0 0 10px rgba(0, 212, 255, 0.2); }
        .sender-tag { font-size: 10px; font-weight: 800; color: var(--admin-neon); margin-bottom: 3px; }

        .footer-credits {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            text-align: center;
            color: #444;
            font-size: 10px;
            line-height: 1.4;
            pointer-events: none;
            z-index: 1;
        }

        .input-bar { padding: 15px 20px; background: #000; border-top: 1px solid #1a1a1a; display: flex; gap: 10px; }
        .main-input { flex: 1; background: #121212; border: 1px solid #222; color: #fff; padding: 12px 20px; border-radius: 25px; }

        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            width: 100%;
            height: var(--nav-height);
            background: #000;
            border-top: 1px solid #1a1a1a;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item { color: #555; text-align: center; font-size: 10px; cursor: pointer; }
        .nav-item.active { color: #fff; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 4px; }

        .screen { display: none; height: 100%; flex-direction: column; }
        .active-screen { display: flex; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="login-card">
            <div class="rgb-logo">BYTECHAT</div>
            <p style="color:#555; margin-top:10px; font-size:12px;">SECURE COMMUNICATION TERMINAL</p>
            <button class="btn-login" onclick="handleLogin()">ACCESS MAINFRAME</button>
            <div style="margin-top:30px; font-size:9px; color:#333;">
                © 2025 Bytechat. Powered by Rodss Architecture.
            </div>
        </div>
    </div>

    <div id="app-shell">
        <aside id="sidebar">
            <div class="rgb-logo" style="font-size:22px; margin-bottom:30px;">BYTECHAT</div>
            <div style="background:#0a0a0a; padding:20px; border-radius:15px; text-align:center; border:1px solid #1a1a1a; margin-bottom:20px;">
                <img id="side-pfp" src="" style="width:60px; height:60px; border-radius:50%; border:1px solid var(--admin-neon);">
                <div id="side-name" style="margin-top:10px; font-weight:bold;">Operator</div>
            </div>
            <nav style="flex:1">
                <div onclick="switchTab('chat')" style="padding:15px; cursor:pointer;"><i class="fa fa-terminal"></i> Mainframe</div>
                <div onclick="switchTab('profile')" style="padding:15px; cursor:pointer;"><i class="fa fa-user"></i> Identity</div>
                <div onclick="switchTab('admin')" class="admin-only" style="padding:15px; cursor:pointer; color:var(--admin-neon);"><i class="fa fa-shield"></i> Admin</div>
            </nav>
            <button onclick="handleLogout()" style="padding:15px; background:none; border:1px solid #222; color:var(--danger); border-radius:10px; cursor:pointer;">DISCONNECT</button>
        </aside>

        <main id="viewport">
            <section id="view-chat" class="screen active-screen">
                <div id="messages-container"></div>
                <div class="footer-credits">
                    © 2025 Bytechat. Powered by Rodss Architecture.<br>
                    Made by Bytestorm<br>
                    Design optimized for mobile and command efficiency.
                </div>
                <div class="input-bar">
                    <input type="text" id="chat-msg" class="main-input" placeholder="Secure transmission...">
                    <button onclick="sendMessage()" style="background:var(--admin-neon); border:none; width:45px; height:45px; border-radius:50%; cursor:pointer;"><i class="fa fa-paper-plane"></i></button>
                </div>
            </section>

            <section id="view-profile" class="screen">
                <div style="padding:40px; max-width:400px; margin:0 auto; width:90%;">
                    <h2 class="rgb-logo" style="font-size:20px;">Identity</h2>
                    <input type="text" id="upd-name" class="main-input" style="width:100%; margin-bottom:10px;" placeholder="Name">
                    <input type="text" id="upd-pfp" class="main-input" style="width:100%; margin-bottom:20px;" placeholder="PFP URL">
                    <button onclick="updateProfile()" style="width:100%; padding:15px; background:white; color:black; border:none; border-radius:10px; font-weight:bold;">SAVE CHANGES</button>
                </div>
            </section>

            <section id="view-admin" class="screen admin-only">
                <div style="padding:40px; text-align:center;">
                    <h2 style="color:var(--admin-neon)">ADMIN TERMINAL</h2>
                    <button onclick="wipeMessages()" style="background:var(--danger); color:white; border:none; padding:20px; border-radius:10px; width:100%; font-weight:bold;">PURGE DATABASE</button>
                </div>
            </section>
        </main>
    </div>

    <div class="mobile-nav">
        <div class="nav-item active" id="m-chat" onclick="switchTab('chat')"><i class="fa fa-comment"></i>Chat</div>
        <div class="nav-item" id="m-profile" onclick="switchTab('profile')"><i class="fa fa-user-circle"></i>User</div>
        <div class="nav-item admin-only" id="m-admin" onclick="switchTab('admin')"><i class="fa fa-lock"></i>Admin</div>
        <div class="nav-item" onclick="handleLogout()" style="color:var(--danger);"><i class="fa fa-power-off"></i>Exit</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCZlueIRciUi4hHxT00y0ez1jKT70ATWw",
            authDomain: "ekosecuruty.firebaseapp.com",
            projectId: "ekosecuruty",
            storageBucket: "ekosecuruty.firebasestorage.app",
            messagingSenderId: "655599032933",
            appId: "1:655599032933:web:c3c429704561672895c48c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const MASTER_EMAIL = "bytestorm.corp@gmail.com";
        let localUser = {};

        // TAB NAVIGATION
        window.switchTab = (target) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById('view-' + target).classList.add('active-screen');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if(document.getElementById('m-' + target)) document.getElementById('m-' + target).classList.add('active');
        };

        // LOGIN/LOGOUT LOGIC
        window.handleLogin = () => {
            signInWithPopup(auth, new GoogleAuthProvider()).catch(err => console.error(err));
        };

        window.handleLogout = () => {
            if(confirm("Disconnect from ByteChat?")) {
                signOut(auth).then(() => {
                    document.body.classList.remove('logged-in');
                    window.location.reload(); 
                });
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.body.classList.add('logged-in');
                const isMaster = user.email.toLowerCase() === MASTER_EMAIL.toLowerCase();
                if(isMaster) document.body.classList.add('is-master');

                const userDoc = await getDoc(doc(db, "users", user.uid));
                localUser = userDoc.exists() ? userDoc.data() : { name: user.displayName, pfp: user.photoURL };
                if(!userDoc.exists()) await setDoc(doc(db, "users", user.uid), localUser);

                document.getElementById('side-pfp').src = localUser.pfp;
                document.getElementById('side-name').innerText = localUser.name;
                document.getElementById('upd-name').value = localUser.name;
                document.getElementById('upd-pfp').value = localUser.pfp;
                loadMessages();
            } else {
                document.body.classList.remove('logged-in');
            }
        });

        // CHAT LOGIC
        window.sendMessage = async () => {
            const el = document.getElementById('chat-msg');
            const val = el.value.trim();
            if(!val) return;
            await addDoc(collection(db, "messages"), {
                text: val, user: localUser.name, pfp: localUser.pfp,
                uid: auth.currentUser.uid, isA: auth.currentUser.email.toLowerCase() === MASTER_EMAIL,
                time: serverTimestamp()
            });
            el.value = "";
        };

        function loadMessages() {
            onSnapshot(query(collection(db, "messages"), orderBy("time", "asc")), (snap) => {
                const box = document.getElementById('messages-container');
                box.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    const isMe = m.uid === auth.currentUser.uid;
                    box.innerHTML += `
                        <div class="msg-row ${isMe ? 'me' : ''}">
                            <img src="${m.pfp}" class="chat-pfp">
                            <div class="bubble ${m.isA ? 'admin-glow' : ''}">
                                <div class="sender-tag">${m.isA ? '[ADMIN] ' : ''}${m.user}</div>
                                <div>${m.text}</div>
                            </div>
                        </div>
                    `;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        window.updateProfile = async () => {
            const name = document.getElementById('upd-name').value;
            const pfp = document.getElementById('upd-pfp').value;
            await setDoc(doc(db, "users", auth.currentUser.uid), { name, pfp }, { merge: true });
            alert("Updated.");
            location.reload();
        };

        window.wipeMessages = async () => {
            if(confirm("PURGE ALL?")) {
                const q = await getDocs(collection(db, "messages"));
                q.forEach(async (d) => await deleteDoc(doc(db, "messages", d.id)));
            }
        };
    </script>
</body>
</html>
