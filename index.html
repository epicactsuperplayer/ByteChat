<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bytechat</title>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-TKJ9JKK7ZF"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-TKJ9JKK7ZF');
</script>

<style>
* { box-sizing: border-box; }
body { font-family: Arial; background: #0f0f0f; color: white; text-align: center; margin: 0; }
h1 { background: #111; padding: 15px; margin: 0; }
#login, #profile, #chat, #admin, #settings { display: none; padding: 20px; }
input { padding: 10px; margin: 5px; border-radius: 6px; border: none; width: 260px; }
button { padding: 10px 20px; margin: 5px; border: none; border-radius: 6px; background: #00aaff; color: white; cursor: pointer; }
button.red { background: #cc0000; }
button.orange { background: #e67e00; }
button.green { background: #00aa44; }
button.gray { background: #444; }
#messages { height: 400px; overflow-y: auto; border: 1px solid #333; margin: 10px; padding: 10px; text-align: left; }
.msg { display: flex; align-items: center; margin: 6px; position: relative; }
.msg img { width: 35px; height: 35px; border-radius: 50%; margin-right: 8px; cursor: pointer; object-fit: cover; flex-shrink: 0; }
.msg .delbtn { display: none; background: #cc0000; border: none; color: white; border-radius: 4px; padding: 2px 7px; cursor: pointer; font-size: 12px; margin-left: 8px; }
.msg:hover .delbtn { display: inline-block; }
#pfpPreview, #settingsPfpPreview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin: 10px; display: none; border: 2px solid #00aaff; }
#topBar { display: none; background: #111; padding: 8px 15px; justify-content: flex-end; gap: 8px; }
#topBar button { padding: 7px 14px; font-size: 13px; }
#modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 999; justify-content: center; align-items: center; }
#modalBox { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 25px; min-width: 280px; max-width: 350px; text-align: center; }
#modalBox img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #00aaff; margin-bottom: 10px; }
#modalBox h3 { margin: 5px 0; }
#modalBox p { color: #aaa; font-size: 14px; margin: 4px 0; }
#adminActions { margin-top: 15px; display: none; }
#settings { max-width: 400px; margin: 0 auto; text-align: left; }
#settings h2 { text-align: center; }
#settings label { display: block; margin: 15px 0 4px; color: #aaa; font-size: 13px; }
#settings input { width: 100%; }
#settingsPfpPreview { display: block; margin: 8px auto; }
#admin { text-align: left; max-width: 600px; margin: 0 auto; }
#admin h2 { text-align: center; }
.adminUser { display: flex; align-items: center; justify-content: space-between; background: #1a1a1a; border-radius: 8px; padding: 10px; margin: 6px 0; flex-wrap: wrap; gap: 6px; }
.adminUser img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; margin-right: 10px; }
.adminUser .info { flex: 1; text-align: left; font-size: 14px; }
.adminUser .info span { display: block; color: #aaa; font-size: 12px; }
.adminUser .btns button { padding: 6px 10px; font-size: 12px; margin: 2px; }
.badge { font-size: 11px; padding: 2px 6px; border-radius: 10px; margin-left: 5px; }
.badge.banned { background: #cc0000; }
.badge.muted { background: #e67e00; }
#verifyBanner { display: none; background: #7a4a00; padding: 10px; font-size: 14px; }
#verifyBanner button { padding: 5px 12px; font-size: 13px; margin-left: 10px; }
</style>
</head>

<body>
<h1>Bytechat</h1>

<div id="topBar">
  <button id="btnOpenSettings">⚙️ Settings</button>
  <button id="btnBackToChat" style="display:none">💬 Back to Chat</button>
  <button class="gray" id="btnLogout">Logout</button>
</div>

<div id="verifyBanner">
  ⚠️ Please verify your email to use the chat.
  <button id="btnResendVerify">Resend Email</button>
</div>

<div id="login">
  <h2>Login</h2>
  <input id="email" placeholder="Email"><br>
  <input id="password" type="password" placeholder="Password"><br>
  <button id="btnLogin">Login</button>
  <button id="btnSignup">Signup</button>
  <button id="btnGoogle">Google Login</button>
  <br><br>
  <input id="resetEmail" placeholder="Email for reset">
  <button id="btnReset">Forgot Password</button>
</div>

<div id="profile">
  <h2>Create Profile</h2>
  <input id="name" placeholder="Your Name"><br>
  <input id="pfpUrl" placeholder="Profile Picture URL (https://...)"><br>
  <input id="about" placeholder="About me (optional)"><br>
  <img id="pfpPreview" src="" alt="Preview"><br>
  <button id="btnSaveProfile">Save Profile</button>
</div>

<div id="chat">
  <div id="messages"></div>
  <input id="messageInput" placeholder="Message">
  <button id="btnSend">Send</button>
</div>

<div id="settings">
  <h2>⚙️ Settings</h2>
  <label>Username</label>
  <input id="settingsName" placeholder="Your Name">
  <label>Profile Picture URL</label>
  <input id="settingsPfpUrl" placeholder="https://...">
  <img id="settingsPfpPreview" src="" alt="Preview">
  <label>About Me</label>
  <input id="settingsAbout" placeholder="Tell us about yourself">
  <br><br>
  <button id="btnSaveSettings" class="green">💾 Save Changes</button>
  <br><br>
  <hr style="border-color:#333; margin: 20px 0;">
  <h3>Change Password</h3>
  <button id="btnChangePassword" class="orange">📧 Send Password Reset Email</button>
</div>

<div id="admin">
  <h2>⚙️ Admin Panel</h2>
  <button id="btnClearChat" class="red">🗑️ Delete All Messages</button>
  <button id="btnRefreshUsers" class="green">🔄 Refresh Users</button>
  <div id="adminUserList"></div>
</div>

<div id="modal">
  <div id="modalBox">
    <img id="modalPfp" src="">
    <h3 id="modalName"></h3>
    <p id="modalEmail"></p>
    <p id="modalAbout"></p>
    <p id="modalStatus"></p>
    <div id="adminActions">
      <button id="btnModalBan" class="red">🔨 Ban User</button>
      <button id="btnModalMute" class="orange">🔇 Mute User</button>
      <button id="btnModalDeleteMsgs" class="red">🗑️ Delete All Messages</button>
    </div>
    <button id="modalClose" class="gray">Close</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-analytics.js";
import {
  getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  signInWithPopup, GoogleAuthProvider, sendPasswordResetEmail,
  onAuthStateChanged, signOut, sendEmailVerification, reload
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc, addDoc, updateDoc,
  collection, onSnapshot, getDocs, deleteDoc, query, where
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAY49sWaN-DSKV10uyBB3CeOiABLCtFrSI",
  authDomain: "bytestorm-friebase-server.firebaseapp.com",
  databaseURL: "https://bytestorm-friebase-server-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "bytestorm-friebase-server",
  storageBucket: "bytestorm-friebase-server.firebasestorage.app",
  messagingSenderId: "400056781433",
  appId: "1:400056781433:web:9803b0711d85de437f62a8",
  measurementId: "G-TKJ9JKK7ZF"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const ADMIN_EMAIL = "bytestorm.corp@gmail.com";
const DEFAULT_PFP = "https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y";
const BAD_WORDS = ["fuck", "shit", "ass", "bitch", "bastard"];

const loginDiv = document.getElementById("login");
const profileDiv = document.getElementById("profile");
const chatDiv = document.getElementById("chat");
const adminDiv = document.getElementById("admin");
const settingsDiv = document.getElementById("settings");
const messagesDiv = document.getElementById("messages");
const topBar = document.getElementById("topBar");
const verifyBanner = document.getElementById("verifyBanner");
const modal = document.getElementById("modal");

let currentModalUid = null;
let isAdmin = false;

function containsBadWord(text) {
  const lower = text.toLowerCase();
  return BAD_WORDS.some(w => lower.includes(w));
}

function showPage(page) {
  chatDiv.style.display = "none";
  settingsDiv.style.display = "none";
  adminDiv.style.display = "none";
  document.getElementById("btnBackToChat").style.display = "none";
  document.getElementById("btnOpenSettings").style.display = "inline-block";
  if (page === "chat") {
    chatDiv.style.display = "block";
    if (isAdmin) adminDiv.style.display = "block";
  } else if (page === "settings") {
    settingsDiv.style.display = "block";
    document.getElementById("btnBackToChat").style.display = "inline-block";
    document.getElementById("btnOpenSettings").style.display = "none";
    loadSettingsForm();
  }
}

document.getElementById("pfpUrl").addEventListener("input", () => {
  const url = document.getElementById("pfpUrl").value.trim();
  const preview = document.getElementById("pfpPreview");
  if (url) { preview.src = url; preview.style.display = "inline-block"; preview.onerror = () => { preview.style.display = "none"; }; }
  else { preview.style.display = "none"; }
});

document.getElementById("settingsPfpUrl").addEventListener("input", () => {
  const url = document.getElementById("settingsPfpUrl").value.trim();
  const preview = document.getElementById("settingsPfpPreview");
  if (url) { preview.src = url; preview.style.display = "block"; preview.onerror = () => { preview.style.display = "none"; }; }
  else { preview.style.display = "none"; }
});

document.getElementById("btnLogin").addEventListener("click", async () => {
  try {
    const email = document.getElementById("email").value;
    const pass = document.getElementById("password").value;
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) { alert(e.message); }
});

document.getElementById("btnSignup").addEventListener("click", async () => {
  try {
    const email = document.getElementById("email").value;
    const pass = document.getElementById("password").value;
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await sendEmailVerification(cred.user);
    alert("Account created! Please verify your email before chatting.");
  } catch(e) { alert(e.message); }
});

document.getElementById("btnGoogle").addEventListener("click", async () => {
  try {
    await signInWithPopup(auth, provider);
  } catch(e) { alert(e.message); }
});

document.getElementById("btnReset").addEventListener("click", async () => {
  try {
    const email = document.getElementById("resetEmail").value;
    await sendPasswordResetEmail(auth, email);
    alert("Reset email sent!");
  } catch(e) { alert(e.message); }
});

document.getElementById("btnResendVerify").addEventListener("click", async () => {
  try {
    await sendEmailVerification(auth.currentUser);
    alert("Verification email sent!");
  } catch(e) { alert(e.message); }
});

document.getElementById("btnSaveProfile").addEventListener("click", async () => {
  try {
    const name = document.getElementById("name").value.trim();
    if (!name) { alert("Please enter a name!"); return; }
    let pfp = document.getElementById("pfpUrl").value.trim();
    if (!pfp) pfp = DEFAULT_PFP;
    const about = document.getElementById("about").value.trim() || "No bio yet.";
    const uid = auth.currentUser.uid;
    await setDoc(doc(db, "users", uid), {
      name, pfp, about,
      email: auth.currentUser.email,
      banned: false,
      muted: false
    });
    loadChat();
  } catch(e) { alert(e.message); }
});

async function loadSettingsForm() {
  try {
    const uid = auth.currentUser.uid;
    const snap = await getDoc(doc(db, "users", uid));
    if (!snap.exists()) return;
    const u = snap.data();
    document.getElementById("settingsName").value = u.name || "";
    document.getElementById("settingsPfpUrl").value = u.pfp || "";
    document.getElementById("settingsAbout").value = u.about || "";
    const preview = document.getElementById("settingsPfpPreview");
    if (u.pfp) { preview.src = u.pfp; preview.style.display = "block"; }
  } catch(e) { alert(e.message); }
}

document.getElementById("btnSaveSettings").addEventListener("click", async () => {
  try {
    const name = document.getElementById("settingsName").value.trim();
    if (!name) { alert("Name cannot be empty!"); return; }
    let pfp = document.getElementById("settingsPfpUrl").value.trim();
    if (!pfp) pfp = DEFAULT_PFP;
    const about = document.getElementById("settingsAbout").value.trim() || "No bio yet.";
    const uid = auth.currentUser.uid;
    await updateDoc(doc(db, "users", uid), { name, pfp, about });
    alert("Profile updated!");
    showPage("chat");
  } catch(e) { alert(e.message); }
});

document.getElementById("btnChangePassword").addEventListener("click", async () => {
  try {
    await sendPasswordResetEmail(auth, auth.currentUser.email);
    alert("Password reset email sent to " + auth.currentUser.email);
  } catch(e) { alert(e.message); }
});

document.getElementById("btnOpenSettings").addEventListener("click", () => showPage("settings"));
document.getElementById("btnBackToChat").addEventListener("click", () => showPage("chat"));
document.getElementById("btnLogout").addEventListener("click", () => signOut(auth));

document.getElementById("btnSend").addEventListener("click", async () => {
  try {
    const text = document.getElementById("messageInput").value.trim();
    if (!text) return;
    const uid = auth.currentUser.uid;
    await reload(auth.currentUser);
    if (!auth.currentUser.emailVerified) {
      alert("Please verify your email before sending messages.");
      return;
    }
    const userSnap = await getDoc(doc(db, "users", uid));
    const userData = userSnap.data();
    if (userData.banned) { alert("You are banned from this chat."); return; }
    if (userData.muted) { alert("You are currently muted."); return; }
    if (containsBadWord(text)) { document.getElementById("messageInput").value = ""; return; }
    await addDoc(collection(db, "messages"), {
      text, name: userData.name, pfp: userData.pfp, uid, time: Date.now()
    });
    document.getElementById("messageInput").value = "";
  } catch(e) { alert(e.message); }
});

document.getElementById("messageInput").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("btnSend").click();
});

document.getElementById("btnClearChat").addEventListener("click", async () => {
  if (!confirm("Delete ALL messages?")) return;
  try {
    const snap = await getDocs(collection(db, "messages"));
    snap.forEach(async d => await deleteDoc(d.ref));
  } catch(e) { alert(e.message); }
});

document.getElementById("btnRefreshUsers").addEventListener("click", loadAdminUsers);

document.getElementById("modalClose").addEventListener("click", () => { modal.style.display = "none"; currentModalUid = null; });
modal.addEventListener("click", e => { if (e.target === modal) { modal.style.display = "none"; currentModalUid = null; } });

document.getElementById("btnModalBan").addEventListener("click", async () => {
  if (!currentModalUid) return;
  const userRef = doc(db, "users", currentModalUid);
  const snap = await getDoc(userRef);
  const banned = snap.data().banned;
  await updateDoc(userRef, { banned: !banned });

  // Delete all messages from user when banned
  if (!banned) {
    const q = query(collection(db, "messages"), where("uid", "==", currentModalUid));
    const msgSnap = await getDocs(q);
    msgSnap.forEach(async d => await deleteDoc(d.ref));
  }

  alert(banned ? "User unbanned." : "User banned and messages deleted.");
  modal.style.display = "none";
  loadAdminUsers();
});

document.getElementById("btnModalMute").addEventListener("click", async () => {
  if (!currentModalUid) return;
  const userRef = doc(db, "users", currentModalUid);
  const snap = await getDoc(userRef);
  const muted = snap.data().muted;
  await updateDoc(userRef, { muted: !muted });
  alert(muted ? "User unmuted." : "User muted.");
  modal.style.display = "none";
  loadAdminUsers();
});

document.getElementById("btnModalDeleteMsgs").addEventListener("click", async () => {
  if (!currentModalUid) return;
  if (!confirm("Delete all messages from this user?")) return;
  const q = query(collection(db, "messages"), where("uid", "==", currentModalUid));
  const snap = await getDocs(q);
  snap.forEach(async d => await deleteDoc(d.ref));
  alert("Messages deleted.");
  modal.style.display = "none";
});

async function openUserModal(uid) {
  try {
    const snap = await getDoc(doc(db, "users", uid));
    if (!snap.exists()) return;
    const u = snap.data();
    currentModalUid = uid;
    document.getElementById("modalPfp").src = u.pfp || DEFAULT_PFP;
    document.getElementById("modalName").textContent = u.name;
    document.getElementById("modalEmail").textContent = "📧 " + (u.email || "Unknown");
    document.getElementById("modalAbout").textContent = "ℹ️ " + (u.about || "No bio yet.");
    document.getElementById("modalStatus").textContent = u.banned ? "🚫 Banned" : u.muted ? "🔇 Muted" : "";
    const adminActions = document.getElementById("adminActions");
    if (isAdmin && uid !== auth.currentUser.uid) {
      adminActions.style.display = "block";
      document.getElementById("btnModalBan").textContent = u.banned ? "✅ Unban User" : "🔨 Ban User";
      document.getElementById("btnModalMute").textContent = u.muted ? "✅ Unmute User" : "🔇 Mute User";
    } else {
      adminActions.style.display = "none";
    }
    modal.style.display = "flex";
  } catch(e) { alert(e.message); }
}

async function loadAdminUsers() {
  const list = document.getElementById("adminUserList");
  list.innerHTML = "<p>Loading...</p>";
  try {
    const snap = await getDocs(collection(db, "users"));
    list.innerHTML = "";
    snap.forEach(d => {
      const u = d.data();
      const uid = d.id;
      const div = document.createElement("div");
      div.className = "adminUser";
      div.innerHTML = `
        <img src="${u.pfp || DEFAULT_PFP}" onerror="this.src='${DEFAULT_PFP}'">
        <div class="info">
          <b>${u.name}</b>
          ${u.banned ? '<span class="badge banned">Banned</span>' : ''}
          ${u.muted ? '<span class="badge muted">Muted</span>' : ''}
          <span>${u.email}</span>
        </div>
        <div class="btns">
          <button class="orange" onclick="window._viewUser('${uid}')">👁️ View</button>
          <button class="${u.banned ? 'green' : 'red'}" onclick="window._toggleBan('${uid}', ${u.banned})">${u.banned ? 'Unban' : 'Ban'}</button>
          <button class="${u.muted ? 'green' : 'orange'}" onclick="window._toggleMute('${uid}', ${u.muted})">${u.muted ? 'Unmute' : 'Mute'}</button>
          <button class="red" onclick="window._deleteUserMsgs('${uid}')">🗑️ Msgs</button>
        </div>
      `;
      list.appendChild(div);
    });
  } catch(e) { list.innerHTML = "<p>Error loading users.</p>"; }
}

window._viewUser = uid => openUserModal(uid);
window._toggleBan = async (uid, banned) => {
  await updateDoc(doc(db, "users", uid), { banned: !banned });
  // Delete messages when banning
  if (!banned) {
    const q = query(collection(db, "messages"), where("uid", "==", uid));
    const snap = await getDocs(q);
    snap.forEach(async d => await deleteDoc(d.ref));
  }
  loadAdminUsers();
};
window._toggleMute = async (uid, muted) => { await updateDoc(doc(db, "users", uid), { muted: !muted }); loadAdminUsers(); };
window._deleteUserMsgs = async uid => {
  if (!confirm("Delete all messages from this user?")) return;
  const q = query(collection(db, "messages"), where("uid", "==", uid));
  const snap = await getDocs(q);
  snap.forEach(async d => await deleteDoc(d.ref));
  alert("Done.");
};

// Delete single message — only visible to admin
async function deleteSingleMessage(msgId) {
  if (!confirm("Delete this message?")) return;
  try {
    await deleteDoc(doc(db, "messages", msgId));
  } catch(e) { alert(e.message); }
}

function loadChat() {
  loginDiv.style.display = "none";
  profileDiv.style.display = "none";
  topBar.style.display = "flex";

  const user = auth.currentUser;
  if (!user.emailVerified && user.providerData[0]?.providerId === "password") {
    verifyBanner.style.display = "block";
  } else {
    verifyBanner.style.display = "none";
  }

  if (user.email === ADMIN_EMAIL) {
    isAdmin = true;
    loadAdminUsers();
  }

  showPage("chat");

  onSnapshot(collection(db, "messages"), snap => {
    messagesDiv.innerHTML = "";
    const sorted = [];
    snap.forEach(d => sorted.push({ id: d.id, ...d.data() }));
    sorted.sort((a, b) => a.time - b.time);
    sorted.forEach(m => {
      const div = document.createElement("div");
      div.className = "msg";

      const img = document.createElement("img");
      img.src = m.pfp || DEFAULT_PFP;
      img.onerror = () => { img.src = DEFAULT_PFP; };
      img.title = m.name;
      img.addEventListener("click", () => openUserModal(m.uid));

      const text = document.createElement("span");
      text.innerHTML = `<b>${m.name}:</b> ${m.text}`;

      div.appendChild(img);
      div.appendChild(text);

      // Single message delete button — admin only
      if (isAdmin) {
        const delBtn = document.createElement("button");
        delBtn.className = "delbtn";
        delBtn.textContent = "🗑️";
        delBtn.title = "Delete this message";
        delBtn.addEventListener("click", () => deleteSingleMessage(m.id));
        div.appendChild(delBtn);
      }

      messagesDiv.appendChild(div);
    });
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  });
}

onAuthStateChanged(auth, async user => {
  if (!user) {
    topBar.style.display = "none";
    verifyBanner.style.display = "none";
    loginDiv.style.display = "block";
    chatDiv.style.display = "none";
    profileDiv.style.display = "none";
    settingsDiv.style.display = "none";
    adminDiv.style.display = "none";
    isAdmin = false;
    return;
  }
  const docSnap = await getDoc(doc(db, "users", user.uid));
  if (!docSnap.exists()) {
    loginDiv.style.display = "none";
    profileDiv.style.display = "block";
  } else {
    loadChat();
  }
});
</script>
</body>
</html>
