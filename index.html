<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ByteChat | RGB Enterprise</title>

    <script>
        window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};
        window.si=window.si||function(){(window.siq=window.siq||[]).push(arguments)};
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-deep: #050505;
            --bg-surface: #0a0a0a;
            --admin-neon: #00d4ff;
            --danger: #ff3b3b;
            --text-main: #f0f0f0;
            --sidebar-width: 280px;
            --nav-height: 80px;
        }

        /* --- RGB ANIMATION --- */
        @keyframes rgbGlow {
            0% { color: #ff0000; text-shadow: 0 0 10px #ff0000; }
            33% { color: #00ff00; text-shadow: 0 0 10px #00ff00; }
            66% { color: #0000ff; text-shadow: 0 0 10px #0000ff; }
            100% { color: #ff0000; text-shadow: 0 0 10px #ff0000; }
        }

        .rgb-text {
            animation: rgbGlow 5s infinite linear;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: var(--bg-deep); color: var(--text-main); font-family: 'Segoe UI', sans-serif; }

        #app-shell { display: flex; width: 100vw; height: 100vh; }

        /* --- SIDEBAR (PC ONLY) --- */
        #sidebar {
            width: var(--sidebar-width);
            background: var(--bg-surface);
            border-right: 1px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            padding: 25px;
            flex-shrink: 0;
            z-index: 10;
        }

        /* --- VIEWPORT --- */
        #viewport { flex-grow: 1; display: flex; flex-direction: column; position: relative; min-width: 0; }

        /* --- STRICT MOBILE FIXES --- */
        @media (max-width: 850px) {
            #sidebar { display: none !important; width: 0; }
            #viewport { width: 100vw; }
            .mobile-nav { display: flex !important; }
            #messages-container { padding: 15px 15px 160px 15px !important; }
            .footer-credits { font-size: 9px !important; bottom: 85px !important; }
        }

        /* --- ADMIN SECURITY --- */
        .admin-only { display: none !important; }
        .is-master .admin-only { display: flex !important; }

        /* --- CHAT UI --- */
        #messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .msg-row { display: flex; gap: 12px; max-width: 85%; align-items: flex-start; }
        .msg-row.me { align-self: flex-end; flex-direction: row-reverse; }

        .chat-pfp {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid #333;
            flex-shrink: 0;
            object-fit: cover;
        }

        .bubble {
            background: #111;
            padding: 12px 18px;
            border-radius: 20px;
            border: 1px solid #222;
            position: relative;
        }

        .admin-bubble { border-color: var(--admin-neon); box-shadow: 0 0 15px rgba(0, 212, 255, 0.15); }

        .sender-tag { font-size: 11px; font-weight: 800; color: var(--admin-neon); margin-bottom: 4px; }

        /* --- FOOTER & CREDITS --- */
        .footer-credits {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            text-align: center;
            color: #444;
            font-size: 11px;
            line-height: 1.5;
            pointer-events: none;
            z-index: 1;
        }

        /* --- INPUT --- */
        .input-bar {
            padding: 20px;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid #1a1a1a;
            display: flex;
            gap: 12px;
            z-index: 5;
        }

        .main-input {
            flex: 1;
            background: #151515;
            border: 1px solid #333;
            color: #fff;
            padding: 14px 22px;
            border-radius: 30px;
            font-size: 15px;
        }

        /* --- MOBILE NAV --- */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            width: 100%;
            height: var(--nav-height);
            background: #000;
            border-top: 1px solid #1a1a1a;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item { color: #555; text-align: center; font-size: 11px; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: #fff; }
        .nav-item i { font-size: 24px; display: block; margin-bottom: 5px; }

        .screen { display: none; height: 100%; flex-direction: column; }
        .active-screen { display: flex; }
    </style>
</head>
<body>

    <div id="app-shell">
        <aside id="sidebar">
            <h1 class="rgb-text" style="text-align: center; margin-bottom: 40px;">BYTECHAT</h1>
            
            <div style="background:#111; padding:20px; border-radius:20px; text-align:center; border:1px solid #222; margin-bottom:30px;">
                <img id="side-pfp" src="" style="width:80px; height:80px; border-radius:50%; border:2px solid var(--admin-neon); object-fit: cover;">
                <h3 id="side-name" style="margin:15px 0 5px 0;">Syncing...</h3>
                <span style="font-size:10px; color:#555;">SECURITY STATUS: ACTIVE</span>
            </div>

            <nav style="flex:1">
                <button onclick="tab('chat')" style="width:100%; background:none; border:none; color:white; padding:15px; text-align:left; cursor:pointer;"><i class="fa fa-terminal"></i> &nbsp; Mainframe</button>
                <button onclick="tab('profile')" style="width:100%; background:none; border:none; color:white; padding:15px; text-align:left; cursor:pointer;"><i class="fa fa-user-gear"></i> &nbsp; User Identity</button>
                <div class="admin-only">
                    <button onclick="tab('admin')" style="width:100%; background:none; border:none; color:var(--admin-neon); padding:15px; text-align:left; cursor:pointer;"><i class="fa fa-shield-halved"></i> &nbsp; Admin Console</button>
                </div>
            </nav>

            <p style="font-size:10px; color:#333; text-align:center;">ARCH Beta 0.5.2</p>
        </aside>

        <main id="viewport">
            <section id="tab-chat" class="screen active-screen">
                <div id="messages-container"></div>
                
                <div class="footer-credits">
                    © 2025 Bytechat. Powered by Rodss Architecture.<br>
                    Made by Bytestorm<br>
                    Design optimized for mobile and command efficiency.
                </div>

                <div class="input-bar">
                    <input type="text" id="chat-input" class="main-input" placeholder="Initiate transmission...">
                    <button onclick="pushMsg()" style="background:white; color:black; border:none; width:50px; height:50px; border-radius:50%; cursor:pointer;"><i class="fa fa-paper-plane"></i></button>
                </div>
            </section>

            <section id="tab-profile" class="screen">
                <div style="padding:40px; max-width:500px; margin:0 auto; width:90%;">
                    <h2 class="rgb-text">User Records</h2>
                    <label style="font-size:11px; color:#555;">DISPLAY ALIAS</label>
                    <input type="text" id="edit-name" class="main-input" style="width:100%; margin:10px 0 20px 0;">
                    <label style="font-size:11px; color:#555;">PFP SOURCE URL</label>
                    <input type="text" id="edit-pfp" class="main-input" style="width:100%; margin:10px 0 30px 0;">
                    <button onclick="saveUser()" style="width:100%; padding:18px; background:var(--admin-neon); color:black; border:none; border-radius:15px; font-weight:bold;">UPDATE IDENTITY</button>
                    <button onclick="signOutNow()" style="width:100%; margin-top:20px; background:none; border:1px solid #333; color:var(--danger); padding:10px; border-radius:10px; cursor:pointer;">Logout</button>
                </div>
            </section>

            <section id="tab-admin" class="screen admin-only">
                <div style="padding:40px; max-width:600px; margin:0 auto;">
                    <h1 style="color:var(--admin-neon)">Root Commands</h1>
                    <div style="background:#111; padding:30px; border-radius:20px; border:1px solid var(--admin-neon);">
                        <p style="margin-bottom:20px;">Mainframe Purge</p>
                        <button onclick="purgeDB()" style="background:var(--danger); color:white; border:none; padding:20px; width:100%; border-radius:15px; font-weight:bold;">ERASE ALL DATABASE PACKETS</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div class="mobile-nav">
        <div class="nav-item active" id="n-chat" onclick="tab('chat')"><i class="fa fa-message"></i>Chat</div>
        <div class="nav-item" id="n-profile" onclick="tab('profile')"><i class="fa fa-id-card"></i>User</div>
        <div class="nav-item admin-only" id="n-admin" onclick="tab('admin')"><i class="fa fa-user-shield"></i>Admin</div>
    </div>

    

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const config = {
            apiKey: "AIzaSyBCZlueIRciUi4hHxT00y0ez1jKT70ATWw",
            authDomain: "ekosecuruty.firebaseapp.com",
            projectId: "ekosecuruty",
            storageBucket: "ekosecuruty.firebasestorage.app",
            messagingSenderId: "655599032933",
            appId: "1:655599032933:web:c3c429704561672895c48c"
        };

        const app = initializeApp(config);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const MASTER = "bytestorm.corp@gmail.com";
        let userCache = {};

        // TAB ENGINE
        window.tab = (t) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById('tab-'+t).classList.add('active-screen');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            const mob = document.getElementById('n-'+t);
            if(mob) mob.classList.add('active');
        };

        // AUTH
        onAuthStateChanged(auth, async (u) => {
            if (u) {
                const isM = u.email.toLowerCase() === MASTER;
                if(isM) document.body.classList.add('is-master');

                const snap = await getDoc(doc(db, "users", u.uid));
                userCache = snap.exists() ? snap.data() : { name: u.displayName, pfp: u.photoURL };
                if(!snap.exists()) await setDoc(doc(db, "users", u.uid), userCache);

                document.getElementById('side-pfp').src = userCache.pfp;
                document.getElementById('side-name').innerText = userCache.name;
                document.getElementById('edit-name').value = userCache.name;
                document.getElementById('edit-pfp').value = userCache.pfp;

                syncChat();
            } else {
                await signInWithPopup(auth, new GoogleAuthProvider());
            }
        });

        // CHAT
        window.pushMsg = async () => {
            const input = document.getElementById('chat-input');
            const txt = input.value.trim();
            if(!txt) return;

            await addDoc(collection(db, "messages"), {
                text: txt,
                user: userCache.name,
                pfp: userCache.pfp,
                uid: auth.currentUser.uid,
                isA: auth.currentUser.email.toLowerCase() === MASTER,
                time: serverTimestamp()
            });
            input.value = "";
        };

        function syncChat() {
            onSnapshot(query(collection(db, "messages"), orderBy("time", "asc")), (s) => {
                const box = document.getElementById('messages-container');
                box.innerHTML = "";
                s.forEach(d => {
                    const m = d.data();
                    const isMe = m.uid === auth.currentUser.uid;
                    const isMaster = auth.currentUser.email.toLowerCase() === MASTER;

                    box.innerHTML += `
                        <div class="msg-row ${isMe ? 'me' : ''}">
                            <img src="${m.pfp}" class="chat-pfp">
                            <div class="bubble ${m.isA ? 'admin-bubble' : ''}">
                                <div class="sender-tag">${m.isA ? '[ADMIN]' : ''} ${m.user}</div>
                                <div>${m.text}</div>
                                ${isMaster ? `<div style="color:var(--danger); font-size:10px; cursor:pointer; margin-top:8px;" onclick="del('${d.id}')">ERASE</div>` : ''}
                            </div>
                        </div>
                    `;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        window.del = async (id) => { if(confirm("Erase?")) await deleteDoc(doc(db, "messages", id)); };
        window.purgeDB = async () => {
            if(confirm("DANGER: WIPE EVERYTHING?")) {
                const q = await getDocs(collection(db, "messages"));
                q.forEach(async (d) => await deleteDoc(doc(db, "messages", d.id)));
            }
        };

        window.saveUser = async () => {
            const name = document.getElementById('edit-name').value;
            const pfp = document.getElementById('edit-pfp').value;
            await setDoc(doc(db, "users", auth.currentUser.uid), { name, pfp }, { merge: true });
            location.reload();
        };

        window.signOutNow = () => signOut(auth);
    </script>
</body>
</html>
