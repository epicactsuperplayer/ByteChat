<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ByteChat | Professional Hybrid</title>

    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- DESIGN SYSTEM --- */
        :root {
            --bg-deep: #080808;
            --bg-surface: #121212;
            --accent: #ffffff;
            --admin-neon: #00d4ff;
            --danger: #ff4757;
            --text-main: #e0e0e0;
            --text-dim: #888888;
            --sidebar-width: 280px;
            --nav-height: 65px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- LAYOUT --- */
        #app-wrapper { display: flex; width: 100%; height: 100%; position: relative; }

        #sidebar {
            width: var(--sidebar-width);
            background: var(--bg-surface);
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        #main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-deep);
            position: relative;
        }

        .screen { display: none; flex: 1; height: 100%; flex-direction: column; overflow-y: auto; }
        .active-screen { display: flex; }

        /* --- UI ELEMENTS --- */
        .logo-box {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 5px;
            margin-bottom: 30px;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--admin-neon);
        }

        .profile-card {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 24px;
            border: 1px solid #333;
        }

        .pfp-main {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--admin-neon);
            margin-bottom: 10px;
        }

        /* --- CHAT SYSTEM --- */
        #messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-row { display: flex; gap: 10px; max-width: 85%; align-items: flex-start; }
        .message-row.self { align-self: flex-end; flex-direction: row-reverse; }

        .msg-content {
            background: var(--bg-surface);
            padding: 10px 15px;
            border-radius: 15px;
            border: 1px solid #222;
        }

        .admin-glow { border-color: var(--admin-neon); box-shadow: 0 0 15px rgba(0, 212, 255, 0.1); }

        .msg-header {
            font-size: 11px;
            font-weight: bold;
            color: var(--admin-neon);
            margin-bottom: 3px;
        }

        /* --- CONTROLS --- */
        .input-bar {
            padding: 15px;
            background: var(--bg-surface);
            border-top: 1px solid #222;
            display: flex;
            gap: 10px;
        }

        .input-field {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            border-radius: 20px;
            outline: none;
        }

        .admin-only { display: none !important; }
        body.is-admin .admin-only { display: flex !important; }

        .delete-trigger {
            color: var(--danger);
            cursor: pointer;
            padding: 5px;
            font-size: 12px;
        }

        /* --- MOBILE NAV --- */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            width: 100%;
            height: var(--nav-height);
            background: #000;
            border-top: 1px solid #222;
            justify-content: space-around;
            align-items: center;
        }

        @media (max-width: 850px) {
            #sidebar { display: none; }
            .mobile-nav { display: flex; }
            .screen { padding-bottom: var(--nav-height); }
        }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <aside id="sidebar">
            <div class="logo-box">BYTECHAT</div>
            
            <div class="profile-card">
                <img id="pc-pfp" src="https://via.placeholder.com/100" class="pfp-main">
                <h4 id="pc-name" style="margin:0;">Guest User</h4>
                <p style="font-size:10px; color:var(--text-dim);">SYSTEM V0.5 BETA</p>
            </div>

            <nav style="flex:1">
                <button onclick="switchTab('chat')" style="width:100%; text-align:left; background:none; border:none; color:white; padding:12px; cursor:pointer;"><i class="fa fa-comment"></i>&nbsp; Terminal</button>
                <button onclick="switchTab('profile')" style="width:100%; text-align:left; background:none; border:none; color:white; padding:12px; cursor:pointer;"><i class="fa fa-user"></i>&nbsp; Profile</button>
                
                <div class="admin-only" style="flex-direction:column;">
                    <button onclick="switchTab('admin')" style="width:100%; text-align:left; background:none; border:none; color:var(--admin-neon); padding:12px; cursor:pointer;"><i class="fa fa-shield"></i>&nbsp; Admin Console</button>
                </div>
            </nav>

            <button onclick="logOut()" style="background:none; border:none; color:var(--danger); cursor:pointer;">Logout</button>
        </aside>

        <main id="main-view">
            <section id="tab-chat" class="screen active-screen">
                <div id="messages-container"></div>
                <div class="input-bar">
                    <input type="text" id="chat-input" class="input-field" placeholder="Message...">
                    <button onclick="sendMessage()" style="background:var(--accent); border:none; width:40px; height:40px; border-radius:50%;"><i class="fa fa-arrow-up"></i></button>
                </div>
            </section>

            <section id="tab-profile" class="screen">
                <div style="padding:40px; max-width:500px; margin:0 auto;">
                    <h2>User Settings</h2>
                    <input type="text" id="edit-name" class="input-field" style="width:100%; margin-bottom:15px;" placeholder="Name">
                    <input type="text" id="edit-pfp" class="input-field" style="width:100%; margin-bottom:15px;" placeholder="PFP URL">
                    <button onclick="updateProfile()" style="width:100%; padding:12px; background:white; color:black; border:none; border-radius:10px; font-weight:bold;">SAVE RECORDS</button>
                </div>
            </section>

            <section id="tab-admin" class="screen">
                <div style="padding:40px; max-width:500px; margin:0 auto;">
                    <h2 style="color:var(--admin-neon)">Global Control</h2>
                    <button onclick="clearAllChat()" style="width:100%; padding:20px; background:var(--danger); border:none; border-radius:10px; color:white; font-weight:bold;">PURGE ALL MESSAGES</button>
                </div>
            </section>
        </main>
    </div>

    <div class="mobile-nav">
        <div class="nav-item active" onclick="switchTab('chat')"><i class="fa fa-comments"></i><span>Chat</span></div>
        <div class="nav-item" onclick="switchTab('profile')"><i class="fa fa-user"></i><span>Profile</span></div>
        <div class="nav-item admin-only" onclick="switchTab('admin')"><i class="fa fa-shield"></i><span>Admin</span></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCZlueIRciUi4hHxT00y0ez1jKT70ATWw",
            authDomain: "ekosecuruty.firebaseapp.com",
            projectId: "ekosecuruty",
            storageBucket: "ekosecuruty.firebasestorage.app",
            messagingSenderId: "655599032933",
            appId: "1:655599032933:web:c3c429704561672895c48c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const MASTER_ADMIN = "bytestorm.corp@gmail.com";
        let userData = {};

        // NAVIGATION
        window.switchTab = (tabId) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById(`tab-${tabId}`).classList.add('active-screen');
        };

        // AUTH
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const isAdmin = user.email.toLowerCase() === MASTER_ADMIN.toLowerCase();
                const snap = await getDoc(doc(db, "users", user.uid));
                
                userData = snap.exists() ? snap.data() : { name: user.displayName, pfp: user.photoURL, role: isAdmin ? 'admin' : 'user' };
                if (isAdmin) document.body.classList.add('is-admin');

                document.getElementById('pc-pfp').src = userData.pfp;
                document.getElementById('pc-name').innerText = userData.name;
                document.getElementById('edit-name').value = userData.name;
                document.getElementById('edit-pfp').value = userData.pfp;
                loadMessages();
            } else {
                await signInWithPopup(auth, new GoogleAuthProvider());
            }
        });

        // ACTIONS
        window.sendMessage = async () => {
            const val = document.getElementById('chat-input').value;
            if(!val.trim()) return;
            await addDoc(collection(db, "messages"), {
                text: val,
                userName: userData.name,
                userPfp: userData.pfp,
                isAdmin: auth.currentUser.email.toLowerCase() === MASTER_ADMIN.toLowerCase(),
                timestamp: serverTimestamp()
            });
            document.getElementById('chat-input').value = "";
        };

        window.deleteMessage = async (id) => {
            if(confirm("Erase?")) await deleteDoc(doc(db, "messages", id));
        };

        window.clearAllChat = async () => {
            if(confirm("Wipe all?")) {
                const q = await getDocs(collection(db, "messages"));
                q.forEach(async (d) => await deleteDoc(doc(db, "messages", d.id)));
            }
        };

        window.updateProfile = async () => {
            const name = document.getElementById('edit-name').value;
            const pfp = document.getElementById('edit-pfp').value;
            await setDoc(doc(db, "users", auth.currentUser.uid), { name, pfp }, { merge: true });
            location.reload();
        };

        window.logOut = () => signOut(auth);

        function loadMessages() {
            onSnapshot(query(collection(db, "messages"), orderBy("timestamp", "asc")), (snap) => {
                const container = document.getElementById('messages-container');
                container.innerHTML = "";
                snap.forEach((doc) => {
                    const m = doc.data();
                    const isMe = auth.currentUser.displayName === m.userName;
                    container.innerHTML += `
                        <div class="message-row ${isMe ? 'self' : ''}">
                            <img src="${m.userPfp}" class="msg-pfp" style="width:30px; height:30px; border-radius:50%">
                            <div class="msg-content ${m.isAdmin ? 'admin-glow' : ''}">
                                <div class="msg-header">${m.userName} ${m.isAdmin ? '⚡' : ''}</div>
                                <div class="msg-text">${m.text}</div>
                            </div>
                            ${auth.currentUser.email === MASTER_ADMIN ? `<i class="fa fa-trash delete-trigger" onclick="deleteMessage('${doc.id}')"></i>` : ''}
                        </div>`;
                });
                container.scrollTop = container.scrollHeight;
            });
        }
    </script>
</body>
</html>
